<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vault Wiki</title>
    <style>
        :root {
            --bg: #1e1e1e; --fg: #e6e6e6; --panel: #252526; --border: #3a3a3a;
            --topbar-bg: rgba(30,30,30,.85); --topbar-border: #333;
            --input-bg: #2a2a2a; --input-border: #444;
            --strong: #fff; --muted: #888; --link-stroke: #999; --node-stroke: #fff;
            --shadow: 0 8px 30px rgba(0,0,0,.5);
        }
        :root[data-theme="light"] {
            --bg: #fafafa; --fg: #24292f; --panel: #fff; --border: #d8dee4;
            --topbar-bg: rgba(255,255,255,.85); --topbar-border: #d8dee4;
            --input-bg: #fff; --input-border: #d0d7de;
            --strong: #111; --muted: #6a737d; --link-stroke: #b0b0b0; --node-stroke: #333;
            --shadow: 0 8px 30px rgba(0,0,0,.15);
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; overflow: hidden; background-color: var(--bg); font-family: Arial, sans-serif; }
        body.arc-mode, body.tree-mode { overflow-y: auto; }
        body.arc-mode .texts text { pointer-events: auto; cursor: pointer; }
        .node { cursor: pointer; }
        .link { fill: none; stroke: var(--link-stroke); stroke-opacity: 0.6; }
        .pack-group { fill: none; stroke: var(--border); stroke-width: 1.5; }
        .pack-node { cursor: pointer; stroke: var(--bg); stroke-width: 1; }
        .pack-label { text-anchor: middle; font-weight: 600; }
        .pack-note-label { text-anchor: middle; }
        .treemap-node { cursor: pointer; stroke: var(--bg); stroke-width: 1; }
        .treemap-label { dominant-baseline: hanging; }
        .tree-link { fill: none; stroke: var(--link-stroke); stroke-opacity: 0.55; stroke-width: 1.5; }
        .tree-node circle { cursor: pointer; stroke: var(--node-stroke); stroke-width: 1.5; }
        .tree-node text { pointer-events: auto; cursor: pointer; }
        text { font-family: Arial, sans-serif; font-size: 12px; pointer-events: none; fill: var(--fg); }
        svg { width: 100vw; height: 100vh; }

        #topbar {
            position: fixed; top: 0; left: 0; right: 0; height: 46px;
            display: flex; align-items: center; gap: 12px; padding: 0 16px;
            background: var(--topbar-bg); backdrop-filter: blur(6px);
            border-bottom: 1px solid var(--topbar-border); z-index: 20;
        }
        #topbar h1 { font-size: 15px; color: var(--fg); margin: 0; font-weight: 600; }
        #vault-form { display: flex; align-items: center; gap: 8px; min-width: 0; }
        #vault-path {
            color: var(--muted); font-size: 12px; max-width: min(28vw, 320px);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        #vault-submit {
            background: var(--input-bg); border: 1px solid var(--input-border); color: var(--fg);
            padding: 6px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap;
        }
        #vault-submit:hover { border-color: #4caf50; }
        #search {
            margin-left: auto; background: var(--input-bg); border: 1px solid var(--input-border);
            color: var(--fg); padding: 6px 10px; border-radius: 6px; width: 220px; outline: none;
        }
        #search:focus { border-color: #4caf50; }
        #graph-type, #arc-order, #pack-order, #treemap-tiling {
            background: var(--input-bg); border: 1px solid var(--input-border); color: var(--fg);
            padding: 6px 28px 6px 10px; border-radius: 6px; outline: none; cursor: pointer;
        }
        #graph-type:focus, #arc-order:focus, #pack-order:focus, #treemap-tiling:focus { border-color: #4caf50; }
        #arc-order[hidden], #pack-order[hidden], #treemap-tiling[hidden] { display: none; }
        #theme-toggle, #colors-toggle {
            background: var(--input-bg); border: 1px solid var(--input-border); color: var(--fg);
            padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; line-height: 1;
        }
        #theme-toggle:hover, #colors-toggle:hover { border-color: #4caf50; }

        #colors-panel {
            position: fixed; top: 52px; right: 16px; z-index: 25; display: none;
            background: var(--panel); color: var(--fg); border: 1px solid var(--border);
            border-radius: 8px; box-shadow: var(--shadow); padding: 12px 14px; font-size: 13px;
        }
        #colors-panel.visible { display: block; }
        #colors-panel label { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        #colors-panel label span { flex: 1; }
        #colors-panel input[type="color"] {
            width: 34px; height: 24px; padding: 0; background: none;
            border: 1px solid var(--input-border); border-radius: 4px; cursor: pointer;
        }
        #colors-panel .hint { color: var(--muted); font-size: 11px; margin: 0 0 10px; max-width: 210px; }
        #colors-reset {
            background: var(--input-bg); border: 1px solid var(--input-border); color: var(--fg);
            padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; width: 100%;
        }
        #colors-reset:hover { border-color: #4caf50; }

        #preview {
            position: fixed; max-width: 360px; max-height: 60vh; overflow: hidden;
            background: var(--panel); color: var(--fg); border: 1px solid var(--border);
            border-radius: 8px; box-shadow: var(--shadow);
            padding: 14px 16px; z-index: 30; pointer-events: none;
            opacity: 0; transition: opacity .12s ease; display: none; font-size: 13px; line-height: 1.5;
        }
        #preview.visible { opacity: 1; display: block; }
        #preview h3 { margin: 0 0 8px; font-size: 15px; color: var(--strong); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        #preview .body { max-height: 44vh; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, #000 70%, transparent); mask-image: linear-gradient(180deg, #000 70%, transparent); }
        #preview img { max-width: 100%; }
        #preview p { margin: 6px 0; }
        #preview .hint { margin-top: 10px; font-size: 11px; color: var(--muted); }

        @media (max-width: 700px) {
            #topbar { height: auto; min-height: 86px; flex-wrap: wrap; gap: 6px; padding: 6px 10px; }
            #topbar h1, #vault-form { order: 1; }
            #vault-form { flex: 1; min-width: auto; }
            #vault-path { display: none; }
            #graph-type, #arc-order, #pack-order, #treemap-tiling, #search, #colors-toggle, #theme-toggle { order: 2; }
            #graph-type { flex: 0 0 155px; min-width: 0; }
            #arc-order, #pack-order, #treemap-tiling { flex: 0 0 105px; min-width: 0; }
            #search { flex: 1; min-width: 70px; width: auto; margin-left: 0; }
        }
    </style>
    <script>
        (function () {
            var saved = localStorage.getItem("vault-theme");
            if (!saved) saved = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", saved);
        })();
    </script>
</head>
<body>
    <div id="topbar">
        <h1>🕸️ Vault Wiki</h1>
        <form id="vault-form" action="/vault" method="post">
            <button id="vault-submit" type="submit">Open vault</button>
            <span id="vault-path" title="{{ vault_dir }}">{{ vault_dir }}</span>
        </form>
        <select id="graph-type" aria-label="Graph type" title="Graph type">
            <option value="force">Force-directed</option>
            <option value="disjoint">Disjoint force-directed</option>
            <option value="arc">Arc diagram</option>
            <option value="pack">Circle packing</option>
            <option value="treemap">Treemap, CSV</option>
            <option value="tree">Collapsible tree</option>
        </select>
        <select id="arc-order" aria-label="Arc diagram order" title="Arc diagram order" hidden>
            <option value="topic">By Topic</option>
            <option value="tag">By Tag</option>
            <option value="name">By Name</option>
        </select>
        <select id="pack-order" aria-label="Circle packing group" title="Circle packing group" hidden>
            <option value="topic">By Topic</option>
            <option value="tag">By Tag</option>
        </select>
        <select id="treemap-tiling" aria-label="Treemap tiling method" title="Treemap tiling method" hidden>
            <option value="binary">Binary</option>
            <option value="squarify">Squarify</option>
            <option value="slice-dice">Slice-dice</option>
        </select>
        <input id="search" type="text" placeholder="Search notes…" autocomplete="off">
        <button id="colors-toggle" type="button" title="Change node colors" aria-label="Change node colors">🎨</button>
        <button id="theme-toggle" type="button" title="Toggle light/dark theme" aria-label="Toggle theme"></button>
    </div>
    <div id="colors-panel">
        <label><span>Topics</span><input id="color-note" type="color"></label>
        <label><span>Tags</span><input id="color-tag" type="color"></label>
        <p class="hint">Notes colored by an Obsidian color group keep their own color.</p>
        <button id="colors-reset" type="button">Reset to defaults</button>
    </div>
    <div id="graph"></div>
    <div id="preview">
        <h3></h3>
        <div class="body"></div>
        <div class="hint">Click to open →</div>
    </div>

    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script>
        var nodes = {{ nodes|safe }};
        var links = {{ links|safe }};
        var colorGroups = {{ color_groups|safe }};

        var DEFAULT_COLORS = { note: "#7f7f7f", tag: "#4caf50" };
        var userColors = {
            note: localStorage.getItem("vault-color-note") || DEFAULT_COLORS.note,
            tag: localStorage.getItem("vault-color-tag") || DEFAULT_COLORS.tag
        };
        nodes.forEach(function (d) { d.baseColor = d.color; });

        // Obsidian color-group nodes keep their color; only default-colored ones follow the picker.
        function nodeColor(d) {
            var type = d.type === "tag" ? "tag" : "note";
            return d.baseColor === DEFAULT_COLORS[type] ? userColors[type] : d.baseColor;
        }

        var width = window.innerWidth;
        var height = window.innerHeight;

        var svg = d3.select("#graph").append("svg")
            .attr("width", width).attr("height", height);
        var g = svg.append("g");

        var zoom = d3.zoom().scaleExtent([0.1, 4]).on("zoom", function () {
            g.attr("transform", d3.event.transform);
        });
        svg.call(zoom);

        function customForce(alpha) {
            const cx = width / 2, cy = height / 2, strength = 0.05;
            for (let i = 0; i < nodes.length; i++) {
                nodes[i].vx += (cx - nodes[i].x) * strength * alpha;
                nodes[i].vy += (cy - nodes[i].y) * strength * alpha;
            }
        }

        var graphType = localStorage.getItem("vault-graph-type") || "force";
        var graphTypeSelect = document.getElementById("graph-type");
        var arcOrder = localStorage.getItem("vault-arc-order") || "topic";
        var arcOrderSelect = document.getElementById("arc-order");
        var packOrder = localStorage.getItem("vault-pack-order") || "topic";
        var packOrderSelect = document.getElementById("pack-order");
        var treemapTiling = localStorage.getItem("vault-treemap-tiling") || "binary";
        var treemapTilingSelect = document.getElementById("treemap-tiling");
        if (!["force", "disjoint", "arc", "pack", "treemap", "tree"].includes(graphType)) graphType = "force";
        if (!["topic", "tag", "name"].includes(arcOrder)) arcOrder = "topic";
        if (!["topic", "tag"].includes(packOrder)) packOrder = "topic";
        if (!["binary", "squarify", "slice-dice"].includes(treemapTiling)) treemapTiling = "binary";
        graphTypeSelect.value = graphType;
        arcOrderSelect.value = arcOrder;
        packOrderSelect.value = packOrder;
        treemapTilingSelect.value = treemapTiling;

        var simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(d => {
                const s = links.filter(l => l.source.id === d.source.id || l.target.id === d.source.id).length;
                const t = links.filter(l => l.source.id === d.target.id || l.target.id === d.target.id).length;
                return Math.min(150, Math.max(50, (s + t) * 10));
            }))
            .force("charge", d3.forceManyBody().strength(-300))
            .force("collision", labelCollision())
            .alphaDecay(0.02).alphaMin(0.001)
            .on("tick", ticked);

        function applyGraphType(type, restart) {
            var arc = type === "arc";
            var pack = type === "pack";
            var treemap = type === "treemap";
            var tree = type === "tree";
            var disjoint = type === "disjoint";
            arcOrderSelect.hidden = !arc;
            packOrderSelect.hidden = !pack;
            treemapTilingSelect.hidden = !treemap;
            document.body.classList.toggle("arc-mode", arc);
            document.body.classList.toggle("tree-mode", tree);
            svg.call(zoom.transform, d3.zoomIdentity);
            link.style("display", pack || treemap || tree ? "none" : null);
            node.style("display", pack || treemap || tree ? "none" : null);
            text.style("display", pack || treemap || tree ? "none" : null);
            packLayer.style("display", pack ? null : "none");
            treemapLayer.style("display", treemap ? null : "none");
            treeLayer.style("display", tree ? null : "none");

            if (tree) {
                simulation.stop();
                svg.style("height", null);
                renderTree();
                return;
            }

            if (treemap) {
                simulation.stop();
                svg.style("height", null);
                renderTreemap(treemapTiling);
                return;
            }

            if (pack) {
                simulation.stop();
                svg.style("height", null);
                renderPack(packOrder);
                return;
            }

            if (arc) {
                simulation.stop();
                renderArc(arcOrder, restart);
                return;
            }

            svg.style("height", null);
            link.attr("d", d => "M" + d.source.x + "," + d.source.y + "L" + d.target.x + "," + d.target.y);
            node.attr("r", d => 5 + Math.sqrt(d.link_count));
            text.attr("text-anchor", null);
            simulation
                .force("center", disjoint ? null : d3.forceCenter(width / 2, height / 2))
                .force("custom", disjoint ? null : customForce)
                .force("x", disjoint ? d3.forceX(width / 2).strength(0.05) : null)
                .force("y", disjoint ? d3.forceY(height / 2).strength(0.05) : null);
            if (restart) simulation.alpha(1).restart();
        }

        var link = g.append("g").attr("class", "links").selectAll("path")
            .data(links).enter().append("path").attr("class", "link");

        var node = g.append("g").attr("class", "nodes").selectAll("circle")
            .data(nodes).enter().append("circle")
            .attr("class", "node")
            .attr("r", d => 5 + Math.sqrt(d.link_count))
            .attr("fill", nodeColor)
            .call(d3.drag().on("start", dragstarted).on("drag", dragged).on("end", dragended))
            .on("mouseover", nodeOver)
            .on("mousemove", nodeMove)
            .on("mouseout", nodeOut)
            .on("click", nodeClick);

        var text = g.append("g").attr("class", "texts").selectAll("text")
            .data(nodes).enter().append("text")
            .attr("x", d => d.x + 8).attr("y", d => d.y + 3).text(d => d.label)
            .on("mouseover", nodeOver)
            .on("mousemove", nodeMove)
            .on("mouseout", nodeOut)
            .on("click", nodeClick);

        var packLayer = g.append("g").attr("class", "pack").style("display", "none");
        var packLeaf = packLayer.selectAll("circle.pack-node");
        var treemapLayer = g.append("g").attr("class", "treemap").style("display", "none");
        var treemapLeaf = treemapLayer.selectAll("rect.treemap-node");
        var treeLayer = g.append("g").attr("class", "tree").style("display", "none");
        var treeLeaf = treeLayer.selectAll("g.tree-node");
        var treeRoot = buildTreeHierarchy();

        function ticked() {
            if (graphType === "arc" || graphType === "pack" || graphType === "treemap" || graphType === "tree") return;
            link.attr("d", d => "M" + d.source.x + "," + d.source.y + "L" + d.target.x + "," + d.target.y);
            node.attr("cx", d => d.x).attr("cy", d => d.y);
            text.attr("x", d => d.x + 8).attr("y", d => d.y + 3);
        }

        function connectedNodes(d, type) {
            return links.map(function (link) {
                if (link.source.id === d.id && link.target.type === type) return link.target;
                if (link.target.id === d.id && link.source.type === type) return link.source;
                return null;
            }).filter(Boolean);
        }

        function arcSortKey(d, order) {
            if (order === "name") return d.label.toLowerCase();
            if (order === "tag") {
                var tags = connectedNodes(d, "tag").sort((a, b) => d3.ascending(a.label, b.label));
                return (d.type === "tag" ? d.label : tags.length ? tags[0].label : "~untagged").toLowerCase();
            }
            var topics = connectedNodes(d, "note").sort((a, b) =>
                d3.descending(a.link_count, b.link_count) || d3.ascending(a.label, b.label));
            return (d.type === "note" && topics.length ? topics[0].label : d.label).toLowerCase();
        }

        function renderArc(order, animate) {
            var top = document.getElementById("topbar").getBoundingClientRect().bottom + 20;
            var step = 20;
            var arcX = Math.min(300, Math.max(140, width * 0.3));
            var ordered = nodes.slice().sort((a, b) =>
                d3.ascending(arcSortKey(a, order), arcSortKey(b, order)) ||
                d3.ascending(a.label.toLowerCase(), b.label.toLowerCase()));
            var arcHeight = Math.max(height, top + ordered.length * step + 20);
            ordered.forEach(function (d, index) { d.x = arcX; d.y = top + index * step; });
            svg.style("height", arcHeight + "px");

            var duration = animate ? 600 : 0;
            node.transition().duration(duration)
                .attr("cx", d => d.x).attr("cy", d => d.y)
                .attr("r", d => 3 + Math.min(4, Math.sqrt(d.link_count)));
            text.transition().duration(duration)
                .attr("x", d => d.x - 8).attr("y", d => d.y + 4)
                .attr("text-anchor", "end");
            link.transition().duration(duration).attr("d", function (d) {
                var radius = Math.abs(d.target.y - d.source.y) / 2;
                return "M" + arcX + "," + d.source.y + "A" + radius + "," + radius + " 0 0,0 " + arcX + "," + d.target.y;
            });
        }

        function packGroupKey(d, order) {
            if (order === "tag") {
                var tags = connectedNodes(d, "tag").sort((a, b) => d3.ascending(a.label, b.label));
                return tags.length ? tags[0].label : "Untagged";
            }
            var topics = connectedNodes(d, "note").sort((a, b) =>
                d3.descending(a.link_count, b.link_count) || d3.ascending(a.label, b.label));
            return topics.length ? topics[0].label : "Unlinked";
        }

        function renderPack(order) {
            var top = document.getElementById("topbar").getBoundingClientRect().bottom;
            var packWidth = width;
            var packHeight = Math.max(320, height - top);
            var groups = d3.nest()
                .key(d => packGroupKey(d, order))
                .entries(nodes.filter(d => d.type === "note"))
                .sort((a, b) => d3.ascending(a.key.toLowerCase(), b.key.toLowerCase()));
            var hierarchy = {
                name: "Vault",
                children: groups.map(group => ({
                    name: group.key,
                    children: group.values.map(item => ({
                        name: item.label,
                        value: Math.max(1, item.link_count),
                        node: item
                    }))
                }))
            };
            var root = d3.pack().size([packWidth, packHeight]).padding(4)(
                d3.hierarchy(hierarchy).sum(d => d.value || 0).sort((a, b) => b.value - a.value));
            var descendants = root.descendants().filter(d => d.depth > 0);

            packLayer.attr("transform", "translate(0," + top + ")").selectAll("*").remove();
            packLayer.selectAll("circle.pack-group")
                .data(descendants.filter(d => d.depth === 1)).enter().append("circle")
                .attr("class", "pack-group")
                .attr("cx", d => d.x).attr("cy", d => d.y).attr("r", d => d.r);

            packLeaf = packLayer.selectAll("circle.pack-node")
                .data(descendants.filter(d => d.depth === 2)).enter().append("circle")
                .attr("class", "pack-node")
                .attr("cx", d => d.x).attr("cy", d => d.y).attr("r", d => d.r)
                .attr("fill", d => nodeColor(d.data.node))
                .attr("opacity", d => {
                    var query = document.getElementById("search").value.trim().toLowerCase();
                    return !query || d.data.name.toLowerCase().includes(query) ? 1 : 0.12;
                })
                .on("mouseover", function (d) { nodeOver.call(this, d.data.node); })
                .on("mousemove", nodeMove)
                .on("mouseout", function (d) { nodeOut.call(this, d.data.node); })
                .on("click", function (d) { nodeClick(d.data.node); });

            packLayer.selectAll("text.pack-label")
                .data(descendants.filter(d => d.depth === 1 && d.r > 32)).enter().append("text")
                .attr("class", "pack-label")
                .attr("x", d => d.x).attr("y", d => d.y - d.r + 15)
                .text(d => {
                    var limit = Math.max(3, Math.floor((d.r * 2 - 12) / 7));
                    return d.data.name.length > limit ? d.data.name.slice(0, limit - 1) + "…" : d.data.name;
                });
            packLayer.selectAll("text.pack-note-label")
                .data(descendants.filter(d => d.depth === 2 && d.r > 13)).enter().append("text")
                .attr("class", "pack-note-label")
                .attr("x", d => d.x).attr("y", d => d.y + 4)
                .style("font-size", d => Math.min(12, Math.max(8, d.r / 3)) + "px")
                .text(d => {
                    var limit = Math.max(3, Math.floor(d.r / 4));
                    return d.data.name.length > limit ? d.data.name.slice(0, limit - 1) + "…" : d.data.name;
                });
        }

        function renderTreemap(tiling) {
            var top = document.getElementById("topbar").getBoundingClientRect().bottom;
            var chartHeight = Math.max(320, height - top);
            var rows = [{ id: "vault", parent: "", value: 0, node: null }].concat(
                nodes.filter(d => d.type === "note").map(d => ({
                    id: "vault/" + d.id,
                    parent: "vault",
                    value: Math.max(1, d.link_count),
                    node: d
                }))
            );
            var tile = {
                binary: d3.treemapBinary,
                squarify: d3.treemapSquarify,
                "slice-dice": d3.treemapSliceDice
            }[tiling];
            var root = d3.treemap()
                .tile(tile)
                .size([width, chartHeight])
                .paddingInner(2)
                .round(true)(
                    d3.stratify().id(d => d.id).parentId(d => d.parent || null)(rows)
                        .sum(d => d.value || 0)
                        .sort((a, b) => b.value - a.value)
                );
            var leaves = root.leaves();
            var query = document.getElementById("search").value.trim().toLowerCase();

            treemapLayer.attr("transform", "translate(0," + top + ")").selectAll("*").remove();
            treemapLeaf = treemapLayer.selectAll("rect.treemap-node")
                .data(leaves).enter().append("rect")
                .attr("class", "treemap-node")
                .attr("x", d => d.x0).attr("y", d => d.y0)
                .attr("width", d => Math.max(0, d.x1 - d.x0))
                .attr("height", d => Math.max(0, d.y1 - d.y0))
                .attr("fill", d => nodeColor(d.data.node))
                .attr("opacity", d => !query || d.data.node.label.toLowerCase().includes(query) ? 1 : 0.12)
                .on("mouseover", function (d) { nodeOver.call(this, d.data.node); })
                .on("mousemove", nodeMove)
                .on("mouseout", function (d) { nodeOut.call(this, d.data.node); })
                .on("click", function (d) { nodeClick(d.data.node); });

            treemapLayer.selectAll("text.treemap-label")
                .data(leaves.filter(d => d.x1 - d.x0 > 38 && d.y1 - d.y0 > 18))
                .enter().append("text")
                .attr("class", "treemap-label")
                .attr("x", d => d.x0 + 5).attr("y", d => d.y0 + 5)
                .text(d => {
                    var limit = Math.max(3, Math.floor((d.x1 - d.x0 - 10) / 7));
                    var label = d.data.node.label;
                    return label.length > limit ? label.slice(0, limit - 1) + "…" : label;
                });
        }

        function buildTreeHierarchy() {
            var noteNodes = nodes.filter(d => d.type === "note");
            var byId = new Map(nodes.map(d => [d.id, d]));
            var neighbors = new Map(noteNodes.map(d => [d.id, []]));
            var tagNeighbors = new Map(noteNodes.map(d => [d.id, []]));

            links.forEach(function (edge) {
                var source = typeof edge.source === "object" ? edge.source : byId.get(edge.source);
                var target = typeof edge.target === "object" ? edge.target : byId.get(edge.target);
                if (!source || !target) return;
                if (source.type === "note" && target.type === "note") {
                    neighbors.get(source.id).push(target);
                    neighbors.get(target.id).push(source);
                } else if (source.type === "note" && target.type === "tag") {
                    tagNeighbors.get(source.id).push(target);
                } else if (target.type === "note" && source.type === "tag") {
                    tagNeighbors.get(target.id).push(source);
                }
            });

            var visitedNotes = new Set();
            var visitedTags = new Set();
            var forest = [];
            noteNodes.slice().sort((a, b) =>
                d3.descending(a.link_count, b.link_count) || d3.ascending(a.label, b.label)
            ).forEach(function (componentRoot) {
                if (visitedNotes.has(componentRoot.id)) return;
                var rootItem = { name: componentRoot.label, node: componentRoot, children: [] };
                var queue = [{ node: componentRoot, item: rootItem }];
                visitedNotes.add(componentRoot.id);
                forest.push(rootItem);

                while (queue.length) {
                    var current = queue.shift();
                    (neighbors.get(current.node.id) || []).slice()
                        .sort((a, b) => d3.ascending(a.label, b.label))
                        .forEach(function (next) {
                            if (visitedNotes.has(next.id)) return;
                            visitedNotes.add(next.id);
                            var child = { name: next.label, node: next, children: [] };
                            current.item.children.push(child);
                            queue.push({ node: next, item: child });
                        });
                    (tagNeighbors.get(current.node.id) || []).slice()
                        .sort((a, b) => d3.ascending(a.label, b.label))
                        .forEach(function (tag) {
                            if (visitedTags.has(tag.id)) return;
                            visitedTags.add(tag.id);
                            current.item.children.push({ name: tag.label, node: tag });
                        });
                }
            });
            var root = d3.hierarchy({ name: "Vault", children: forest });
            root.children.forEach(function (branch) {
                if (!branch.children) return;
                branch._children = branch.children;
                branch.children = null;
            });
            return root;
        }

        function renderTree() {
            var top = document.getElementById("topbar").getBoundingClientRect().bottom + 20;
            var treeColumnWidth = width < 700 ? 130 : 300;
            var treeLabelLimit = width < 700 ? 24 : 38;
            d3.tree().nodeSize([24, treeColumnWidth])(treeRoot);
            var descendants = treeRoot.descendants();
            var minX = d3.min(descendants, d => d.x) || 0;
            var maxX = d3.max(descendants, d => d.x) || 0;
            var offsetX = top + 20 - minX;

            svg.style("height", Math.max(height, maxX - minX + top + 60) + "px");
            treeLayer.attr("transform", "translate(40," + offsetX + ")");

            var treeLinks = treeLayer.selectAll("path.tree-link")
                .data(treeRoot.links(), d => d.target.data.node ? d.target.data.node.id : "vault");
            treeLinks.exit().transition().duration(250).attr("opacity", 0).remove();
            treeLinks.enter().append("path").attr("class", "tree-link").merge(treeLinks)
                .transition().duration(350)
                .attr("d", d => "M" + d.source.y + "," + d.source.x +
                    "C" + (d.source.y + d.target.y) / 2 + "," + d.source.x + " " +
                    (d.source.y + d.target.y) / 2 + "," + d.target.x + " " +
                    d.target.y + "," + d.target.x);

            treeLeaf = treeLayer.selectAll("g.tree-node")
                .data(descendants, d => d.data.node ? d.data.node.id : "vault");
            treeLeaf.exit().transition().duration(250).attr("opacity", 0).remove();
            var entered = treeLeaf.enter().append("g").attr("class", "tree-node")
                .attr("transform", d => "translate(" + d.y + "," + d.x + ")");
            entered.append("circle").attr("r", 5);
            entered.append("text").attr("dy", "0.32em").attr("x", 9);
            treeLeaf = entered.merge(treeLeaf);
            treeLeaf.transition().duration(350)
                .attr("transform", d => "translate(" + d.y + "," + d.x + ")");
            treeLeaf.select("circle")
                .attr("fill", d => d.data.node ? nodeColor(d.data.node) : userColors.note)
                .attr("r", d => d.children || d._children ? 6 : 4)
                .attr("stroke-width", d => d._children ? 3 : 1.5)
                .on("click", function (d) {
                    if (!d.children && !d._children) return;
                    if (d.children) { d._children = d.children; d.children = null; }
                    else { d.children = d._children; d._children = null; }
                    renderTree();
                });
            treeLeaf.select("text")
                .text(d => d.data.name.length > treeLabelLimit ? d.data.name.slice(0, treeLabelLimit - 1) + "…" : d.data.name)
                .on("mouseover", function (d) { if (d.data.node) nodeOver.call(this, d.data.node); })
                .on("mousemove", nodeMove)
                .on("mouseout", function (d) { if (d.data.node) nodeOut.call(this, d.data.node); })
                .on("click", function (d) { if (d.data.node) nodeClick(d.data.node); });
            applySearchHighlight();
        }

        applyGraphType(graphType, false);
        graphTypeSelect.addEventListener("change", function () {
            graphType = this.value;
            localStorage.setItem("vault-graph-type", graphType);
            applyGraphType(graphType, true);
        });
        arcOrderSelect.addEventListener("change", function () {
            arcOrder = this.value;
            localStorage.setItem("vault-arc-order", arcOrder);
            renderArc(arcOrder, true);
        });
        packOrderSelect.addEventListener("change", function () {
            packOrder = this.value;
            localStorage.setItem("vault-pack-order", packOrder);
            renderPack(packOrder);
        });
        treemapTilingSelect.addEventListener("change", function () {
            treemapTiling = this.value;
            localStorage.setItem("vault-treemap-tiling", treemapTiling);
            renderTreemap(treemapTiling);
        });

        function dragstarted(d) {
            if (graphType === "arc" || graphType === "pack" || graphType === "treemap" || graphType === "tree") return;
            if (!d3.event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x; d.fy = d.y;
        }
        function dragged(d) {
            if (graphType === "arc" || graphType === "pack" || graphType === "treemap" || graphType === "tree") return;
            d.fx = d3.event.x; d.fy = d3.event.y;
        }
        function dragended(d) {
            if (graphType === "arc" || graphType === "pack" || graphType === "treemap" || graphType === "tree") return;
            if (!d3.event.active) simulation.alphaTarget(0);
            d.fx = null; d.fy = null;
        }

        function labelCollision() {
            var alpha = 0.5;
            return function () {
                for (var i = 0; i < nodes.length; i++) {
                    for (var j = i + 1; j < nodes.length; j++) {
                        var a = nodes[i], b = nodes[j];
                        if (a === b) continue;
                        var dx = a.x - b.x, dy = a.y - b.y;
                        var dist = Math.sqrt(dx * dx + dy * dy), min = 20;
                        if (dist < min) {
                            var f = (min - dist) / dist * alpha;
                            var mx = dx * f, my = dy * f;
                            a.x += mx; a.y += my; b.x -= mx; b.y -= my;
                        }
                    }
                }
            };
        }

        // ---- Hover preview + click navigation ----
        var previewEl = document.getElementById("preview");
        var previewTitle = previewEl.querySelector("h3");
        var previewBody = previewEl.querySelector(".body");
        var previewHint = previewEl.querySelector(".hint");
        var previewCache = {};
        var hoverToken = 0;

        function noteUrl(d) { return "/note/" + encodeURIComponent(d.id); }
        function tagUrl(d) { return "/tag/" + encodeURIComponent(d.id.replace(/^#/, "")); }

        function nodeClick(d) {
            window.location.href = d.type === "tag" ? tagUrl(d) : noteUrl(d);
        }

        function nodeOver(d) {
            var strokeColor = getComputedStyle(document.documentElement).getPropertyValue("--node-stroke").trim();
            if (["circle", "rect"].includes(this.tagName.toLowerCase())) {
                d3.select(this).attr("stroke", strokeColor).attr("stroke-width", 1.5);
            }
            if (graphType === "arc") emphasizeArcLinks(d);
            var token = ++hoverToken;

            if (d.type === "tag") {
                previewTitle.textContent = d.label;
                previewBody.innerHTML = "<p>" + d.link_count + " note(s) tagged with this.</p>";
                previewHint.textContent = "Click to list notes \u2192";
                previewHint.style.display = "block";
                showPreview();
                return;
            }
            previewHint.textContent = "Click to open \u2192";
            previewHint.style.display = "block";

            if (previewCache[d.id]) {
                renderPreview(previewCache[d.id]);
                return;
            }
            previewTitle.textContent = d.label;
            previewBody.innerHTML = "<p style='color:var(--muted)'>Loading…</p>";
            showPreview();

            fetch("/api/preview/" + encodeURIComponent(d.id))
                .then(r => r.ok ? r.json() : Promise.reject())
                .then(data => {
                    previewCache[d.id] = data;
                    if (token === hoverToken) renderPreview(data);
                })
                .catch(() => {
                    if (token === hoverToken) previewBody.innerHTML = "<p style='color:#c66'>No preview.</p>";
                });
        }

        function renderPreview(data) {
            previewTitle.textContent = data.title;
            previewBody.innerHTML = data.html;
            showPreview();
        }

        function showPreview() { previewEl.classList.add("visible"); }

        function emphasizeArcLinks(hovered) {
            var connected = new Set([hovered.id]);
            link.each(function (d) {
                if (d.source.id === hovered.id) connected.add(d.target.id);
                if (d.target.id === hovered.id) connected.add(d.source.id);
            });
            link
                .attr("stroke", d => d.source.id === hovered.id || d.target.id === hovered.id ? "#000" : null)
                .attr("stroke-opacity", d => d.source.id === hovered.id || d.target.id === hovered.id ? 1 : 0.04)
                .attr("stroke-width", d => d.source.id === hovered.id || d.target.id === hovered.id ? 2 : 1);
            node.attr("opacity", d => connected.has(d.id) ? 1 : 0.12);
            text.attr("opacity", d => connected.has(d.id) ? 1 : 0.08);
        }

        function nodeMove() {
            var pad = 16, ex = d3.event.clientX, ey = d3.event.clientY;
            var w = previewEl.offsetWidth, h = previewEl.offsetHeight;
            var x = ex + pad, y = ey + pad;
            if (x + w > window.innerWidth) x = ex - w - pad;
            if (y + h > window.innerHeight) y = window.innerHeight - h - pad;
            if (y < 52) y = 52;
            previewEl.style.left = x + "px";
            previewEl.style.top = y + "px";
        }

        function nodeOut() {
            if (["circle", "rect"].includes(this.tagName.toLowerCase())) d3.select(this).attr("stroke", null);
            if (graphType === "arc") {
                link.attr("stroke", null).attr("stroke-opacity", null).attr("stroke-width", null);
                applySearchHighlight();
            }
            hoverToken++;
            previewEl.classList.remove("visible");
        }

        // ---- Search: highlight & focus matching nodes ----
        var search = document.getElementById("search");
        function applySearchHighlight() {
            var q = document.getElementById("search").value.trim().toLowerCase();
            node.attr("opacity", d => !q || d.label.toLowerCase().includes(q) ? 1 : 0.12);
            text.attr("opacity", d => !q || d.label.toLowerCase().includes(q) ? 1 : 0.08);
            packLeaf.attr("opacity", d => !q || d.data.name.toLowerCase().includes(q) ? 1 : 0.12);
            treemapLeaf.attr("opacity", d => !q || d.data.node.label.toLowerCase().includes(q) ? 1 : 0.12);
            treeLeaf.attr("opacity", d => !q || d.data.name.toLowerCase().includes(q) ? 1 : 0.12);
        }
        search.addEventListener("input", applySearchHighlight);

        // ---- Node color pickers ----
        var colorsPanel = document.getElementById("colors-panel");
        var colorInputs = { note: document.getElementById("color-note"), tag: document.getElementById("color-tag") };

        function applyColors() {
            colorInputs.note.value = userColors.note;
            colorInputs.tag.value = userColors.tag;
            node.attr("fill", nodeColor);
            packLeaf.attr("fill", d => nodeColor(d.data.node));
            treemapLeaf.attr("fill", d => nodeColor(d.data.node));
            treeLeaf.select("circle").attr("fill", d => d.data.node ? nodeColor(d.data.node) : userColors.note);
        }

        Object.keys(colorInputs).forEach(function (type) {
            colorInputs[type].addEventListener("input", function () {
                userColors[type] = this.value;
                localStorage.setItem("vault-color-" + type, this.value);
                node.attr("fill", nodeColor);
                packLeaf.attr("fill", d => nodeColor(d.data.node));
                treemapLeaf.attr("fill", d => nodeColor(d.data.node));
                treeLeaf.select("circle").attr("fill", d => d.data.node ? nodeColor(d.data.node) : userColors.note);
            });
        });

        document.getElementById("colors-reset").addEventListener("click", function () {
            userColors = { note: DEFAULT_COLORS.note, tag: DEFAULT_COLORS.tag };
            localStorage.removeItem("vault-color-note");
            localStorage.removeItem("vault-color-tag");
            applyColors();
        });

        document.getElementById("colors-toggle").addEventListener("click", function (e) {
            e.stopPropagation();
            colorsPanel.classList.toggle("visible");
        });
        colorsPanel.addEventListener("click", function (e) { e.stopPropagation(); });
        document.addEventListener("click", function () { colorsPanel.classList.remove("visible"); });

        applyColors();

        // ---- Theme toggle ----
        var themeToggle = document.getElementById("theme-toggle");
        function syncThemeButton() {
            var dark = document.documentElement.getAttribute("data-theme") !== "light";
            themeToggle.textContent = dark ? "☀️" : "🌙";
        }
        themeToggle.addEventListener("click", function () {
            var next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
            document.documentElement.setAttribute("data-theme", next);
            localStorage.setItem("vault-theme", next);
            syncThemeButton();
        });
        syncThemeButton();
    </script>
</body>
</html>
