<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vault Wiki</title>
    <style>
        :root {
            --bg: #1e1e1e; --fg: #e6e6e6; --panel: #252526; --border: #3a3a3a;
            --topbar-bg: rgba(30,30,30,.85); --topbar-border: #333;
            --input-bg: #2a2a2a; --input-border: #444;
            --strong: #fff; --muted: #888; --link-stroke: #999; --node-stroke: #fff;
            --shadow: 0 8px 30px rgba(0,0,0,.5);
        }
        :root[data-theme="light"] {
            --bg: #fafafa; --fg: #24292f; --panel: #fff; --border: #d8dee4;
            --topbar-bg: rgba(255,255,255,.85); --topbar-border: #d8dee4;
            --input-bg: #fff; --input-border: #d0d7de;
            --strong: #111; --muted: #6a737d; --link-stroke: #b0b0b0; --node-stroke: #333;
            --shadow: 0 8px 30px rgba(0,0,0,.15);
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; overflow: hidden; background-color: var(--bg); font-family: Arial, sans-serif; }
        body.arc-mode, body.tree-mode { overflow-y: auto; }
        body.arc-mode .texts text { pointer-events: auto; cursor: pointer; }
        .node { cursor: pointer; }
        .link { fill: none; stroke: var(--link-stroke); stroke-opacity: 0.6; }
        .pack-group { fill: none; stroke: var(--border); stroke-width: 1.5; }
        .pack-node { cursor: pointer; stroke: var(--bg); stroke-width: 1; }
        .pack-label { text-anchor: middle; font-weight: 600; }
        .pack-note-label { text-anchor: middle; }
        .treemap-node { cursor: pointer; stroke: var(--bg); stroke-width: 1; }
        .treemap-label { dominant-baseline: hanging; }
        .tree-link { fill: none; stroke: var(--link-stroke); stroke-opacity: 0.55; stroke-width: 1.5; }
        .tree-node circle { cursor: pointer; stroke: var(--node-stroke); stroke-width: 1.5; }
        .tree-node text { pointer-events: auto; cursor: pointer; }
        text { font-family: Arial, sans-serif; font-size: 12px; pointer-events: none; fill: var(--fg); }
        svg { width: 100vw; height: 100vh; }

        #topbar {
            position: fixed; top: 0; left: 0; right: 0; height: 46px;
            display: flex; align-items: center; gap: 12px; padding: 0 16px;
            background: var(--topbar-bg); backdrop-filter: blur(6px);
            border-bottom: 1px solid var(--topbar-border); z-index: 20;
        }
        #topbar h1 { font-size: 15px; color: var(--fg); margin: 0; font-weight: 600; }
        #vault-form { display: flex; align-items: center; gap: 8px; min-width: 0; }
        #vault-path {
            color: var(--muted); font-size: 12px; max-width: min(28vw, 320px);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        #vault-submit, #new-note {
            background: var(--input-bg); border: 1px solid var(--input-border); color: var(--fg);
            padding: 6px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap;
            font-size: 13px; text-decoration: none;
        }
        #vault-submit:hover, #new-note:hover { border-color: #4caf50; }
        #search {
            margin-left: auto; background: var(--input-bg); border: 1px solid var(--input-border);
            color: var(--fg); padding: 6px 10px; border-radius: 6px; width: 220px; outline: none;
        }
        #search:focus { border-color: #4caf50; }
        #search-panel {
            position: fixed; top: 46px; left: 0; bottom: 0; z-index: 18;
            width: min(390px, 92vw); display: flex; flex-direction: column;
            background: var(--panel); color: var(--fg); border-right: 1px solid var(--border);
            box-shadow: var(--shadow); transform: translateX(-100%); visibility: hidden;
            transition: transform .18s ease;
        }
        #search-panel.visible { transform: translateX(0); visibility: visible; }
        .search-results-header {
            display: flex; align-items: center; min-height: 42px; padding: 8px 14px;
            color: var(--muted); border-bottom: 1px solid var(--border); font-size: 12px;
        }
        #search-results { flex: 1; overflow-y: auto; }
        .search-result {
            display: block; padding: 11px 14px 13px; color: var(--fg);
            border-bottom: 1px solid var(--border); text-decoration: none;
        }
        .search-result:hover { background: var(--input-bg); }
        .search-result-title { color: var(--strong); font-size: 13px; font-weight: 600; }
        .search-result-count { margin-left: 6px; color: var(--muted); font-size: 11px; font-weight: 400; }
        .search-result-snippet {
            margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45;
            overflow-wrap: anywhere;
        }
        .search-result mark {
            padding: 0 1px; background: #ffd866; color: #242424; border-radius: 2px;
        }
        .search-empty { padding: 22px 14px; color: var(--muted); font-size: 13px; }
        #graph-type, #arc-order, #pack-order, #treemap-tiling {
            background: var(--input-bg); border: 1px solid var(--input-border); color: var(--fg);
            padding: 6px 28px 6px 10px; border-radius: 6px; outline: none; cursor: pointer;
        }
        #graph-type:focus, #arc-order:focus, #pack-order:focus, #treemap-tiling:focus { border-color: #4caf50; }
        #arc-order[hidden], #pack-order[hidden], #treemap-tiling[hidden] { display: none; }
        #theme-toggle, #colors-toggle, #force-controls-toggle {
            background: var(--input-bg); border: 1px solid var(--input-border); color: var(--fg);
            padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; line-height: 1;
        }
        #theme-toggle:hover, #colors-toggle:hover, #force-controls-toggle:hover { border-color: #4caf50; }
        #force-controls-toggle[hidden] { display: none; }

        #force-controls-panel {
            position: fixed; top: 52px; right: 16px; z-index: 25; display: none;
            background: var(--panel); color: var(--fg); border: 1px solid var(--border);
            border-radius: 8px; box-shadow: var(--shadow); padding: 12px 14px; font-size: 13px;
        }
        #force-controls-panel.visible { display: block; }
        #colors-panel {
            position: fixed; top: 46px; right: 0; bottom: 0; z-index: 25;
            width: min(340px, 92vw); display: flex; flex-direction: column;
            background: var(--panel); color: var(--fg); border-left: 1px solid var(--border);
            box-shadow: var(--shadow); transform: translateX(100%);
            transition: transform .2s ease; visibility: hidden;
        }
        #colors-panel.visible { transform: translateX(0); visibility: visible; }
        .colors-header {
            display: flex; align-items: center; gap: 10px; padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }
        .colors-header h2 { flex: 1; margin: 0; font-size: 15px; }
        #colors-close, .color-reset {
            border: 0; background: transparent; color: var(--muted); cursor: pointer;
        }
        #colors-close { width: 30px; height: 30px; font-size: 20px; }
        #colors-close:hover, .color-reset:hover { color: var(--fg); }
        #colors-filter {
            margin: 12px 16px 6px; padding: 7px 9px; color: var(--fg);
            background: var(--input-bg); border: 1px solid var(--input-border);
            border-radius: 6px; outline: none;
        }
        #colors-filter:focus { border-color: #4caf50; }
        #colors-list { flex: 1; overflow-y: auto; padding: 4px 16px 16px; }
        .color-section h3 {
            position: sticky; top: 0; z-index: 1; margin: 10px 0 4px; padding: 7px 0;
            background: var(--panel); color: var(--muted); font-size: 11px;
            text-transform: uppercase; font-weight: 600;
        }
        .color-row {
            display: grid; grid-template-columns: minmax(0, 1fr) 36px 26px;
            align-items: center; gap: 8px; min-height: 34px;
        }
        .color-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .color-row input[type="color"] {
            width: 36px; height: 26px; padding: 0; background: none;
            border: 1px solid var(--input-border); border-radius: 4px; cursor: pointer;
        }
        #colors-reset {
            background: var(--input-bg); border: 1px solid var(--input-border); color: var(--fg);
            padding: 7px 10px; margin: 10px 16px 14px; border-radius: 6px;
            cursor: pointer; font-size: 12px;
        }
        #colors-reset:hover { border-color: #4caf50; }
        #force-controls-panel { width: 250px; }
        #force-controls-panel .force-control {
            display: grid; grid-template-columns: 92px 1fr 38px; align-items: center;
            gap: 8px; margin-bottom: 12px;
        }
        #force-controls-panel .force-control:last-child { margin-bottom: 0; }
        #force-controls-panel input[type="range"] { width: 100%; accent-color: #4caf50; }
        #force-controls-panel output { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }

        #preview {
            position: fixed; max-width: 360px; max-height: 60vh; overflow: hidden;
            background: var(--panel); color: var(--fg); border: 1px solid var(--border);
            border-radius: 8px; box-shadow: var(--shadow);
            padding: 14px 16px; z-index: 30; pointer-events: none;
            opacity: 0; transition: opacity .12s ease; display: none; font-size: 13px; line-height: 1.5;
        }
        #preview.visible { opacity: 1; display: block; }
        #preview h3 { margin: 0 0 8px; font-size: 15px; color: var(--strong); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        #preview .body { max-height: 44vh; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, #000 70%, transparent); mask-image: linear-gradient(180deg, #000 70%, transparent); }
        #preview img { max-width: 100%; }
        #preview p { margin: 6px 0; }
        #preview .hint { margin-top: 10px; font-size: 11px; color: var(--muted); }

        @media (max-width: 700px) {
            #topbar { height: auto; min-height: 86px; flex-wrap: wrap; gap: 6px; padding: 6px 10px; }
            #topbar h1, #vault-form, #new-note { order: 1; }
            #vault-form { flex: 1; min-width: auto; }
            #vault-path { display: none; }
            #graph-type, #arc-order, #pack-order, #treemap-tiling, #search, #force-controls-toggle, #colors-toggle, #theme-toggle { order: 2; }
            #graph-type { flex: 0 0 155px; min-width: 0; }
            #arc-order, #pack-order, #treemap-tiling { flex: 0 0 105px; min-width: 0; }
            #search { flex: 1; min-width: 70px; width: auto; margin-left: 0; }
            #colors-panel { top: 86px; }
            #search-panel { top: 86px; }
        }
    </style>
    <script>
        (function () {
            var saved = localStorage.getItem("vault-theme");
            if (!saved) saved = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", saved);
        })();
    </script>
</head>
<body>
    <div id="topbar">
        <h1>🕸️ Vault Wiki</h1>
        <form id="vault-form" action="/vault" method="post">
            <button id="vault-submit" type="submit">Open vault</button>
            <span id="vault-path" title="{{ vault_dir }}">{{ vault_dir }}</span>
        </form>
        <a id="new-note" href="{{ url_for('create_note') }}">New note</a>
        <select id="graph-type" aria-label="Graph type" title="Graph type">
            <option value="force">Force-directed</option>
            <option value="disjoint">Disjoint force-directed</option>
            <option value="arc">Arc diagram</option>
            <option value="pack">Circle packing</option>
            <option value="treemap">Treemap, CSV</option>
            <option value="tree">Collapsible tree</option>
        </select>
        <select id="arc-order" aria-label="Arc diagram order" title="Arc diagram order" hidden>
            <option value="topic">By Topic</option>
            <option value="tag">By Tag</option>
            <option value="name">By Name</option>
        </select>
        <select id="pack-order" aria-label="Circle packing group" title="Circle packing group" hidden>
            <option value="topic">By Topic</option>
            <option value="tag">By Tag</option>
        </select>
        <select id="treemap-tiling" aria-label="Treemap tiling method" title="Treemap tiling method" hidden>
            <option value="binary">Binary</option>
            <option value="squarify">Squarify</option>
            <option value="slice-dice">Slice-dice</option>
        </select>
        <input id="search" type="search" placeholder="Search notes…" autocomplete="off"
               aria-label="Search note titles and text" aria-controls="search-panel" aria-expanded="false">
        <button id="force-controls-toggle" type="button" title="Adjust graph forces" aria-label="Adjust graph forces">⚙</button>
        <button id="colors-toggle" type="button" title="Change node colors" aria-label="Change node colors">🎨</button>
        <button id="theme-toggle" type="button" title="Toggle light/dark theme" aria-label="Toggle theme"></button>
    </div>
    <aside id="search-panel" aria-label="Search results" inert>
        <div class="search-results-header" id="search-summary"></div>
        <div id="search-results"></div>
    </aside>
    <div id="force-controls-panel">
        <div class="force-control"><label for="force-center">Center force</label><input id="force-center" type="range" min="0" max="0.2" step="0.01"><output for="force-center"></output></div>
        <div class="force-control"><label for="force-repel">Repel force</label><input id="force-repel" type="range" min="0" max="1000" step="10"><output for="force-repel"></output></div>
        <div class="force-control"><label for="force-link">Link force</label><input id="force-link" type="range" min="0" max="2" step="0.05"><output for="force-link"></output></div>
        <div class="force-control"><label for="force-distance">Link distance</label><input id="force-distance" type="range" min="20" max="300" step="5"><output for="force-distance"></output></div>
    </div>
    <aside id="colors-panel" aria-label="Node colors" inert>
        <div class="colors-header">
            <h2>Node colors</h2>
            <button id="colors-close" type="button" title="Close color sidebar" aria-label="Close color sidebar">×</button>
        </div>
        <input id="colors-filter" type="search" placeholder="Filter topics and tags" autocomplete="off">
        <div id="colors-list"></div>
        <button id="colors-reset" type="button">Reset all colors</button>
    </aside>
    <div id="graph"></div>
    <div id="preview">
        <h3></h3>
        <div class="body"></div>
        <div class="hint">Click to open →</div>
    </div>

    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script src="{{ url_for('static', filename='force.js') }}"></script>
    <script src="{{ url_for('static', filename='disjoint.js') }}"></script>
    <script src="{{ url_for('static', filename='arc.js') }}"></script>
    <script src="{{ url_for('static', filename='pack.js') }}"></script>
    <script src="{{ url_for('static', filename='treemap.js') }}"></script>
    <script src="{{ url_for('static', filename='tree.js') }}"></script>
    <script>
        var nodes = {{ nodes|safe }};
        var links = {{ links|safe }};
        var colorGroups = {{ color_groups|safe }};

        var DEFAULT_COLORS = { note: "#7f7f7f", tag: "#4caf50" };
        var userNodeColors = {};
        try {
            userNodeColors = JSON.parse(localStorage.getItem("vault-node-colors") || "{}") || {};
        } catch (error) {
            localStorage.removeItem("vault-node-colors");
        }
        nodes.forEach(function (d) { d.baseColor = d.color; });

        function topicColorKey(topic) {
            return "topic:" + topic.toLowerCase();
        }

        function nodeColor(d) {
            if (d.type === "note") {
                var ownTopicColor = userNodeColors[
                    topicColorKey(d.id.replace(/\.md$/i, ""))
                ];
                if (ownTopicColor) return ownTopicColor;
                for (var index = 0; index < d.topics.length; index++) {
                    var topicColor = userNodeColors[topicColorKey(d.topics[index])];
                    if (topicColor) return topicColor;
                }
                for (var tagIndex = 0; tagIndex < d.tags.length; tagIndex++) {
                    var tagColor = userNodeColors["#" + d.tags[tagIndex]];
                    if (tagColor) return tagColor;
                }
                return d.baseColor;
            }
            return userNodeColors[d.id] || d.baseColor;
        }

        var width = window.innerWidth;
        var height = window.innerHeight;

        var svg = d3.select("#graph").append("svg")
            .attr("width", width).attr("height", height);
        var g = svg.append("g");

        var zoom = d3.zoom().scaleExtent([0.1, 4]).on("zoom", function () {
            g.attr("transform", d3.event.transform);
        });
        svg.call(zoom);

        var forceSettings = {
            center: Number(localStorage.getItem("vault-force-center") || 0.05),
            repel: Number(localStorage.getItem("vault-force-repel") || 300),
            link: Number(localStorage.getItem("vault-force-link") || 0.3),
            distance: Number(localStorage.getItem("vault-force-distance") || 100)
        };

        function customForce(alpha) {
            const cx = width / 2, cy = height / 2, strength = forceSettings.center;
            for (let i = 0; i < nodes.length; i++) {
                nodes[i].vx += (cx - nodes[i].x) * strength * alpha;
                nodes[i].vy += (cy - nodes[i].y) * strength * alpha;
            }
        }

        var graphType = localStorage.getItem("vault-graph-type") || "force";
        var graphTypeSelect = document.getElementById("graph-type");
        var forceControlsPanel = document.getElementById("force-controls-panel");
        var forceControlsToggle = document.getElementById("force-controls-toggle");
        var arcOrder = localStorage.getItem("vault-arc-order") || "topic";
        var arcOrderSelect = document.getElementById("arc-order");
        var packOrder = localStorage.getItem("vault-pack-order") || "topic";
        var packOrderSelect = document.getElementById("pack-order");
        var treemapTiling = localStorage.getItem("vault-treemap-tiling") || "binary";
        var treemapTilingSelect = document.getElementById("treemap-tiling");
        if (!["force", "disjoint", "arc", "pack", "treemap", "tree"].includes(graphType)) graphType = "force";
        if (!["topic", "tag", "name"].includes(arcOrder)) arcOrder = "topic";
        if (!["topic", "tag"].includes(packOrder)) packOrder = "topic";
        if (!["binary", "squarify", "slice-dice"].includes(treemapTiling)) treemapTiling = "binary";
        graphTypeSelect.value = graphType;
        arcOrderSelect.value = arcOrder;
        packOrderSelect.value = packOrder;
        treemapTilingSelect.value = treemapTiling;

        var simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(forceSettings.distance).strength(forceSettings.link))
            .force("charge", d3.forceManyBody().strength(-forceSettings.repel))
            .force("collision", labelCollision())
            .alphaDecay(0.02).alphaMin(0.001)
            .on("tick", ticked);

        function applyGraphType(type, restart) {
            var arc = type === "arc";
            var pack = type === "pack";
            var treemap = type === "treemap";
            var tree = type === "tree";
            var disjoint = type === "disjoint";
            var forceControlsAvailable = type === "force" || disjoint;
            arcOrderSelect.hidden = !arc;
            packOrderSelect.hidden = !pack;
            treemapTilingSelect.hidden = !treemap;
            forceControlsToggle.hidden = !forceControlsAvailable;
            if (!forceControlsAvailable) forceControlsPanel.classList.remove("visible");
            document.body.classList.toggle("arc-mode", arc);
            document.body.classList.toggle("tree-mode", tree);
            svg.call(zoom.transform, d3.zoomIdentity);
            link.style("display", pack || treemap || tree ? "none" : null);
            node.style("display", pack || treemap || tree ? "none" : null);
            text.style("display", pack || treemap || tree ? "none" : null);
            packLayer.style("display", pack ? null : "none");
            treemapLayer.style("display", treemap ? null : "none");
            treeLayer.style("display", tree ? null : "none");

            if (tree) {
                simulation.stop();
                svg.style("height", null);
                renderTree();
                return;
            }

            if (treemap) {
                simulation.stop();
                svg.style("height", null);
                renderTreemap(treemapTiling);
                return;
            }

            if (pack) {
                simulation.stop();
                svg.style("height", null);
                renderPack(packOrder);
                return;
            }

            if (arc) {
                simulation.stop();
                renderArc(arcOrder, restart);
                return;
            }

            if (disjoint) renderDisjoint(restart);
            else renderForce(restart);
        }

        var link = g.append("g").attr("class", "links").selectAll("path")
            .data(links).enter().append("path").attr("class", "link");

        var node = g.append("g").attr("class", "nodes").selectAll("circle")
            .data(nodes).enter().append("circle")
            .attr("class", "node")
            .attr("r", d => 5 + Math.sqrt(d.link_count))
            .attr("fill", nodeColor)
            .call(d3.drag().on("start", dragstarted).on("drag", dragged).on("end", dragended))
            .on("mouseover", nodeOver)
            .on("mousemove", nodeMove)
            .on("mouseout", nodeOut)
            .on("click", nodeClick);

        var text = g.append("g").attr("class", "texts").selectAll("text")
            .data(nodes).enter().append("text")
            .attr("x", d => d.x + 8).attr("y", d => d.y + 3).text(d => d.label)
            .on("mouseover", nodeOver)
            .on("mousemove", nodeMove)
            .on("mouseout", nodeOut)
            .on("click", nodeClick);

        var packLayer = g.append("g").attr("class", "pack").style("display", "none");
        var packLeaf = packLayer.selectAll("circle.pack-node");
        var treemapLayer = g.append("g").attr("class", "treemap").style("display", "none");
        var treemapLeaf = treemapLayer.selectAll("rect.treemap-node");
        var treeLayer = g.append("g").attr("class", "tree").style("display", "none");
        var treeLeaf = treeLayer.selectAll("g.tree-node");
        var treeRoot = buildTreeHierarchy();

        function ticked() {
            if (graphType === "arc" || graphType === "pack" || graphType === "treemap" || graphType === "tree") return;
            link.attr("d", d => "M" + d.source.x + "," + d.source.y + "L" + d.target.x + "," + d.target.y);
            node.attr("cx", d => d.x).attr("cy", d => d.y);
            text.attr("x", d => d.x + 8).attr("y", d => d.y + 3);
        }

        function connectedNodes(d, type) {
            return links.map(function (link) {
                if (link.source.id === d.id && link.target.type === type) return link.target;
                if (link.target.id === d.id && link.source.type === type) return link.source;
                return null;
            }).filter(Boolean);
        }

        applyGraphType(graphType, false);
        graphTypeSelect.addEventListener("change", function () {
            graphType = this.value;
            localStorage.setItem("vault-graph-type", graphType);
            applyGraphType(graphType, true);
        });
        arcOrderSelect.addEventListener("change", function () {
            arcOrder = this.value;
            localStorage.setItem("vault-arc-order", arcOrder);
            renderArc(arcOrder, true);
        });
        packOrderSelect.addEventListener("change", function () {
            packOrder = this.value;
            localStorage.setItem("vault-pack-order", packOrder);
            renderPack(packOrder);
        });
        treemapTilingSelect.addEventListener("change", function () {
            treemapTiling = this.value;
            localStorage.setItem("vault-treemap-tiling", treemapTiling);
            renderTreemap(treemapTiling);
        });

        var forceInputs = {
            center: document.getElementById("force-center"),
            repel: document.getElementById("force-repel"),
            link: document.getElementById("force-link"),
            distance: document.getElementById("force-distance")
        };

        Object.keys(forceInputs).forEach(function (name) {
            var input = forceInputs[name];
            var output = input.nextElementSibling;
            input.value = forceSettings[name];
            output.value = forceSettings[name];
            input.addEventListener("input", function () {
                forceSettings[name] = Number(this.value);
                output.value = this.value;
                localStorage.setItem("vault-force-" + name, this.value);
                simulation.force("charge").strength(-forceSettings.repel);
                simulation.force("link").strength(forceSettings.link).distance(forceSettings.distance);
                simulation.alpha(0.7).restart();
            });
        });

        forceControlsToggle.addEventListener("click", function (e) {
            e.stopPropagation();
            setColorsPanel(false);
            forceControlsPanel.classList.toggle("visible");
        });
        forceControlsPanel.addEventListener("click", function (e) { e.stopPropagation(); });
        document.addEventListener("click", function () { forceControlsPanel.classList.remove("visible"); });

        function dragstarted(d) {
            if (graphType === "arc" || graphType === "pack" || graphType === "treemap" || graphType === "tree") return;
            if (!d3.event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x; d.fy = d.y;
        }
        function dragged(d) {
            if (graphType === "arc" || graphType === "pack" || graphType === "treemap" || graphType === "tree") return;
            d.fx = d3.event.x; d.fy = d3.event.y;
        }
        function dragended(d) {
            if (graphType === "arc" || graphType === "pack" || graphType === "treemap" || graphType === "tree") return;
            if (!d3.event.active) simulation.alphaTarget(0);
            d.fx = null; d.fy = null;
        }

        function labelCollision() {
            var alpha = 0.5;
            return function () {
                for (var i = 0; i < nodes.length; i++) {
                    for (var j = i + 1; j < nodes.length; j++) {
                        var a = nodes[i], b = nodes[j];
                        if (a === b) continue;
                        var dx = a.x - b.x, dy = a.y - b.y;
                        var dist = Math.sqrt(dx * dx + dy * dy), min = 20;
                        if (dist < min) {
                            var f = (min - dist) / dist * alpha;
                            var mx = dx * f, my = dy * f;
                            a.x += mx; a.y += my; b.x -= mx; b.y -= my;
                        }
                    }
                }
            };
        }

        // ---- Hover preview + click navigation ----
        var previewEl = document.getElementById("preview");
        var previewTitle = previewEl.querySelector("h3");
        var previewBody = previewEl.querySelector(".body");
        var previewHint = previewEl.querySelector(".hint");
        var previewCache = {};
        var hoverToken = 0;

        function noteUrl(d) { return "/note/" + encodeURIComponent(d.id); }
        function tagUrl(d) { return "/tag/" + encodeURIComponent(d.id.replace(/^#/, "")); }

        function nodeClick(d) {
            window.location.href = d.type === "tag" ? tagUrl(d) : noteUrl(d);
        }

        function nodeOver(d) {
            var strokeColor = getComputedStyle(document.documentElement).getPropertyValue("--node-stroke").trim();
            if (["circle", "rect"].includes(this.tagName.toLowerCase())) {
                d3.select(this).attr("stroke", strokeColor).attr("stroke-width", 1.5);
            }
            if (["force", "disjoint", "arc"].includes(graphType)) emphasizeConnectedNodes(d);
            var token = ++hoverToken;

            if (d.type === "tag") {
                previewTitle.textContent = d.label;
                previewBody.innerHTML = "<p>" + d.link_count + " note(s) tagged with this.</p>";
                previewHint.textContent = "Click to list notes \u2192";
                previewHint.style.display = "block";
                showPreview();
                return;
            }
            previewHint.textContent = "Click to open \u2192";
            previewHint.style.display = "block";

            if (previewCache[d.id]) {
                renderPreview(previewCache[d.id]);
                return;
            }
            previewTitle.textContent = d.label;
            previewBody.innerHTML = "<p style='color:var(--muted)'>Loading…</p>";
            showPreview();

            fetch("/api/preview/" + encodeURIComponent(d.id))
                .then(r => r.ok ? r.json() : Promise.reject())
                .then(data => {
                    previewCache[d.id] = data;
                    if (token === hoverToken) renderPreview(data);
                })
                .catch(() => {
                    if (token === hoverToken) previewBody.innerHTML = "<p style='color:#c66'>No preview.</p>";
                });
        }

        function renderPreview(data) {
            previewTitle.textContent = data.title;
            previewBody.innerHTML = data.html;
            showPreview();
        }

        function showPreview() { previewEl.classList.add("visible"); }

        function emphasizeConnectedNodes(hovered) {
            var connected = new Set([hovered.id]);
            link.each(function (d) {
                if (d.source.id === hovered.id) connected.add(d.target.id);
                if (d.target.id === hovered.id) connected.add(d.source.id);
            });
            link
                .attr("stroke", d => d.source.id === hovered.id || d.target.id === hovered.id ? "#000" : null)
                .attr("stroke-opacity", d => d.source.id === hovered.id || d.target.id === hovered.id ? 1 : 0.04)
                .attr("stroke-width", d => d.source.id === hovered.id || d.target.id === hovered.id ? 2 : 1);
            node.attr("opacity", d => connected.has(d.id) ? 1 : 0.12);
            text.attr("opacity", d => connected.has(d.id) ? 1 : 0.08);
        }

        function nodeMove() {
            var pad = 16, ex = d3.event.clientX, ey = d3.event.clientY;
            var w = previewEl.offsetWidth, h = previewEl.offsetHeight;
            var x = ex + pad, y = ey + pad;
            if (x + w > window.innerWidth) x = ex - w - pad;
            if (y + h > window.innerHeight) y = window.innerHeight - h - pad;
            if (y < 52) y = 52;
            previewEl.style.left = x + "px";
            previewEl.style.top = y + "px";
        }

        function nodeOut() {
            if (["circle", "rect"].includes(this.tagName.toLowerCase())) d3.select(this).attr("stroke", null);
            if (["force", "disjoint", "arc"].includes(graphType)) {
                link.attr("stroke", null).attr("stroke-opacity", null).attr("stroke-width", null);
                applySearchHighlight();
            }
            hoverToken++;
            previewEl.classList.remove("visible");
        }

        // ---- Search: highlight graph nodes and show full-text results ----
        var search = document.getElementById("search");
        var searchPanel = document.getElementById("search-panel");
        var searchSummary = document.getElementById("search-summary");
        var searchResults = document.getElementById("search-results");
        var searchTimer;
        var searchToken = 0;

        function applySearchHighlight() {
            var q = search.value.trim().toLowerCase();
            node.attr("opacity", d => !q || d.label.toLowerCase().includes(q) ? 1 : 0.12);
            text.attr("opacity", d => !q || d.label.toLowerCase().includes(q) ? 1 : 0.08);
            packLeaf.attr("opacity", d => !q || d.data.name.toLowerCase().includes(q) ? 1 : 0.12);
            treemapLeaf.attr("opacity", d => !q || d.data.node.label.toLowerCase().includes(q) ? 1 : 0.12);
            treeLeaf.attr("opacity", d => !q || d.data.name.toLowerCase().includes(q) ? 1 : 0.12);
        }

        function setSearchPanel(open) {
            searchPanel.classList.toggle("visible", open);
            searchPanel.inert = !open;
            search.setAttribute("aria-expanded", String(open));
        }

        function highlightedText(text, query) {
            var fragment = document.createDocumentFragment();
            var lowerText = text.toLocaleLowerCase();
            var lowerQuery = query.toLocaleLowerCase();
            var cursor = 0;
            var index;
            while ((index = lowerText.indexOf(lowerQuery, cursor)) !== -1) {
                fragment.appendChild(document.createTextNode(text.slice(cursor, index)));
                var mark = document.createElement("mark");
                mark.textContent = text.slice(index, index + query.length);
                fragment.appendChild(mark);
                cursor = index + query.length;
            }
            fragment.appendChild(document.createTextNode(text.slice(cursor)));
            return fragment;
        }

        function renderSearchResults(results, query) {
            searchResults.replaceChildren();
            searchSummary.textContent = results.length + (results.length === 1 ? " note" : " notes");
            if (!results.length) {
                var empty = document.createElement("div");
                empty.className = "search-empty";
                empty.textContent = "No matching notes";
                searchResults.appendChild(empty);
                return;
            }

            results.forEach(function (result) {
                var item = document.createElement("a");
                item.className = "search-result";
                item.href = result.url;
                var title = document.createElement("div");
                title.className = "search-result-title";
                title.appendChild(highlightedText(result.title, query));
                if (result.match_count) {
                    var count = document.createElement("span");
                    count.className = "search-result-count";
                    count.textContent = result.match_count + (result.match_count === 1 ? " match" : " matches");
                    title.appendChild(count);
                }
                item.appendChild(title);
                result.snippets.forEach(function (snippet) {
                    var context = document.createElement("p");
                    context.className = "search-result-snippet";
                    context.appendChild(highlightedText(snippet.text, query));
                    item.appendChild(context);
                });
                searchResults.appendChild(item);
            });
        }

        function searchNoteText() {
            clearTimeout(searchTimer);
            applySearchHighlight();
            var query = search.value.trim();
            var token = ++searchToken;
            if (!query) {
                setSearchPanel(false);
                searchResults.replaceChildren();
                return;
            }

            setSearchPanel(true);
            searchSummary.textContent = "Searching…";
            searchTimer = setTimeout(function () {
                fetch("/api/search?q=" + encodeURIComponent(query))
                    .then(response => response.ok ? response.json() : Promise.reject())
                    .then(data => {
                        if (token === searchToken) renderSearchResults(data.results, query);
                    })
                    .catch(() => {
                        if (token !== searchToken) return;
                        searchSummary.textContent = "Search unavailable";
                        searchResults.replaceChildren();
                    });
            }, 180);
        }

        search.addEventListener("input", searchNoteText);

        // ---- Node color pickers ----
        var colorsPanel = document.getElementById("colors-panel");
        var colorsToggle = document.getElementById("colors-toggle");
        var colorsList = document.getElementById("colors-list");
        var colorsFilter = document.getElementById("colors-filter");

        function applyColors() {
            node.attr("fill", nodeColor);
            packLeaf.attr("fill", d => nodeColor(d.data.node));
            treemapLeaf.attr("fill", d => nodeColor(d.data.node));
            treeLeaf.select("circle").attr("fill", d => d.data.node ? nodeColor(d.data.node) : DEFAULT_COLORS.note);
        }

        function saveNodeColors() {
            localStorage.setItem("vault-node-colors", JSON.stringify(userNodeColors));
        }

        function createColorSection(items, title) {
            var section = document.createElement("section");
            section.className = "color-section";
            var heading = document.createElement("h3");
            heading.textContent = title + " (" + items.length + ")";
            section.appendChild(heading);

            items.forEach(function (item) {
                var row = document.createElement("div");
                row.className = "color-row";
                row.dataset.label = item.label.toLowerCase();
                var name = document.createElement("span");
                name.textContent = item.label;
                name.title = item.label;
                var input = document.createElement("input");
                input.type = "color";
                input.value = userNodeColors[item.id] || item.baseColor;
                input.dataset.baseColor = item.baseColor;
                input.setAttribute("aria-label", "Color for " + item.label);
                input.addEventListener("input", function () {
                    userNodeColors[item.id] = this.value;
                    saveNodeColors();
                    applyColors();
                });
                var reset = document.createElement("button");
                reset.type = "button";
                reset.className = "color-reset";
                reset.textContent = "↺";
                reset.title = "Reset " + item.label;
                reset.setAttribute("aria-label", "Reset color for " + item.label);
                reset.addEventListener("click", function () {
                    delete userNodeColors[item.id];
                    input.value = item.baseColor;
                    saveNodeColors();
                    applyColors();
                });
                row.append(name, input, reset);
                section.appendChild(row);
            });
            colorsList.appendChild(section);
        }

        var topicsByKey = new Map();
        nodes.filter(d => d.type === "note").forEach(function (note) {
            note.topics.forEach(function (topic) {
                var id = topicColorKey(topic);
                if (!topicsByKey.has(id)) {
                    topicsByKey.set(id, {
                        id: id,
                        label: topic,
                        baseColor: note.baseColor
                    });
                }
            });
        });
        var topicItems = Array.from(topicsByKey.values())
            .sort((a, b) => a.label.localeCompare(b.label));
        var tagItems = nodes.filter(d => d.type === "tag")
            .sort((a, b) => a.label.localeCompare(b.label));
        createColorSection(topicItems, "Topics");
        createColorSection(tagItems, "Tags");

        colorsFilter.addEventListener("input", function () {
            var query = this.value.trim().toLowerCase();
            colorsList.querySelectorAll(".color-row").forEach(function (row) {
                row.hidden = query && !row.dataset.label.includes(query);
            });
        });

        document.getElementById("colors-reset").addEventListener("click", function () {
            userNodeColors = {};
            localStorage.removeItem("vault-node-colors");
            colorsList.querySelectorAll("input[type=color]").forEach(function (input) {
                input.value = input.dataset.baseColor;
            });
            applyColors();
        });

        function setColorsPanel(open) {
            colorsPanel.classList.toggle("visible", open);
            colorsPanel.inert = !open;
            colorsToggle.setAttribute("aria-expanded", String(open));
        }

        colorsToggle.addEventListener("click", function (e) {
            e.stopPropagation();
            forceControlsPanel.classList.remove("visible");
            setColorsPanel(!colorsPanel.classList.contains("visible"));
        });
        document.getElementById("colors-close").addEventListener("click", function () {
            setColorsPanel(false);
        });

        applyColors();

        // ---- Theme toggle ----
        var themeToggle = document.getElementById("theme-toggle");
        function syncThemeButton() {
            var dark = document.documentElement.getAttribute("data-theme") !== "light";
            themeToggle.textContent = dark ? "☀️" : "🌙";
        }
        themeToggle.addEventListener("click", function () {
            var next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
            document.documentElement.setAttribute("data-theme", next);
            localStorage.setItem("vault-theme", next);
            syncThemeButton();
        });
        syncThemeButton();
    </script>
</body>
</html>
