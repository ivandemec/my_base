<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} — Vault Wiki</title>
    <style>
        :root { --bg: #1e1e1e; --panel: #252526; --fg: #d8d8d8; --accent: #4caf50; --link: #7cb7ff; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--fg);
            font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; line-height: 1.7; }
        header {
            position: sticky; top: 0; display: flex; align-items: center; gap: 14px;
            padding: 12px 24px; background: rgba(30,30,30,.9); backdrop-filter: blur(6px);
            border-bottom: 1px solid #333; z-index: 10;
        }
        header a.back { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 14px; }
        header a.back:hover { text-decoration: underline; }
        header .crumb { color: #888; font-size: 13px; }
        main { max-width: 760px; margin: 0 auto; padding: 40px 24px 120px; }
        h1.page-title { font-size: 30px; margin: 0 0 24px; color: #fff; border-bottom: 1px solid #333; padding-bottom: 14px; }
        .content h1, .content h2, .content h3 { color: #fff; margin-top: 1.6em; }
        .content a { color: var(--link); text-decoration: none; }
        .content a:hover { text-decoration: underline; }
        .content img { max-width: 100%; border-radius: 6px; }
        .content blockquote { border-left: 3px solid var(--accent); margin: 1em 0; padding: 2px 16px; color: #b8b8b8; background: #232323; }
        .content code { background: #2d2d2d; padding: 2px 6px; border-radius: 4px; font-size: .9em; }
        .content pre { background: #2d2d2d; padding: 14px 16px; border-radius: 8px; overflow-x: auto; }
        .content pre code { background: none; padding: 0; }
        .content table { border-collapse: collapse; width: 100%; margin: 1em 0; }
        .content th, .content td { border: 1px solid #3a3a3a; padding: 8px 12px; }
        .content hr { border: none; border-top: 1px solid #333; margin: 2em 0; }
    </style>
</head>
<body>
    <header>
        <a class="back" href="/">← Graph</a>
        <span class="crumb">{{ title }}</span>
    </header>
    <main>
        <h1 class="page-title">{{ title }}</h1>
        <div class="content">{{ body|safe }}</div>
    </main>
</body>
</html>
