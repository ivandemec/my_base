<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} — Vault Wiki</title>
    <style>
        :root {
            --bg: #1e1e1e; --panel: #252526; --fg: #d8d8d8; --accent: #4caf50; --link: #7cb7ff;
            --strong: #fff; --border: #333; --border-soft: #3a3a3a; --muted: #888;
            --header-bg: rgba(30,30,30,.9); --code-bg: #2d2d2d; --quote-bg: #232323; --quote-fg: #b8b8b8;
            --input-bg: #2a2a2a; --input-border: #444;
        }
        :root[data-theme="light"] {
            --bg: #fafafa; --panel: #fff; --fg: #24292f; --accent: #2e7d32; --link: #0969da;
            --strong: #111; --border: #d8dee4; --border-soft: #d8dee4; --muted: #6a737d;
            --header-bg: rgba(255,255,255,.9); --code-bg: #f0f2f4; --quote-bg: #f4f6f8; --quote-fg: #4b5563;
            --input-bg: #fff; --input-border: #d0d7de;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--fg);
            font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; line-height: 1.7; }
        header {
            position: sticky; top: 0; display: flex; align-items: center; gap: 14px;
            padding: 12px 24px; background: var(--header-bg); backdrop-filter: blur(6px);
            border-bottom: 1px solid var(--border); z-index: 10;
        }
        header a.back { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 14px; }
        header a.back:hover { text-decoration: underline; }
        header .crumb { color: var(--muted); font-size: 13px; }
        #theme-toggle {
            margin-left: auto; background: var(--input-bg); border: 1px solid var(--input-border);
            color: var(--fg); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; line-height: 1;
        }
        #theme-toggle:hover { border-color: var(--accent); }
        main { max-width: 760px; margin: 0 auto; padding: 40px 24px 120px; }
        h1.page-title { font-size: 30px; margin: 0 0 24px; color: var(--strong); border-bottom: 1px solid var(--border); padding-bottom: 14px; }
        .content h1, .content h2, .content h3 { color: var(--strong); margin-top: 1.6em; }
        .content a { color: var(--link); text-decoration: none; }
        .content a:hover { text-decoration: underline; }
        .content img { max-width: 100%; border-radius: 6px; }
        .content blockquote { border-left: 3px solid var(--accent); margin: 1em 0; padding: 2px 16px; color: var(--quote-fg); background: var(--quote-bg); }
        .content code { background: var(--code-bg); padding: 2px 6px; border-radius: 4px; font-size: .9em; }
        .content pre { background: var(--code-bg); padding: 14px 16px; border-radius: 8px; overflow-x: auto; }
        .content pre code { background: none; padding: 0; }
        .content table { border-collapse: collapse; width: 100%; margin: 1em 0; }
        .content th, .content td { border: 1px solid var(--border-soft); padding: 8px 12px; }
        .content hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
    </style>
    <script>
        (function () {
            var saved = localStorage.getItem("vault-theme");
            if (!saved) saved = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", saved);
        })();
    </script>
</head>
<body>
    <header>
        <a class="back" href="/">← Graph</a>
        <span class="crumb">{{ title }}</span>
        <button id="theme-toggle" type="button" title="Toggle light/dark theme" aria-label="Toggle theme"></button>
    </header>
    <main>
        <h1 class="page-title">{{ title }}</h1>
        <div class="content">{{ body|safe }}</div>
    </main>
    <script>
        var themeToggle = document.getElementById("theme-toggle");
        function syncThemeButton() {
            var dark = document.documentElement.getAttribute("data-theme") !== "light";
            themeToggle.textContent = dark ? "☀️" : "🌙";
        }
        themeToggle.addEventListener("click", function () {
            var next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
            document.documentElement.setAttribute("data-theme", next);
            localStorage.setItem("vault-theme", next);
            syncThemeButton();
        });
        syncThemeButton();
    </script>
</body>
</html>
