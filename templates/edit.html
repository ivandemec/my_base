<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editing {{ title }} — Vault Wiki</title>
    <style>
        :root {
            --bg: #1e1e1e; --panel: #252526; --fg: #d8d8d8; --accent: #4caf50; --link: #7cb7ff;
            --strong: #fff; --border: #333; --border-soft: #3a3a3a; --muted: #888;
            --header-bg: rgba(30,30,30,.9); --hover-bg: #333; --code-bg: #2d2d2d;
            --quote-bg: #232323; --quote-fg: #b8b8b8; --embed: #b58bff;
        }
        :root[data-theme="light"] {
            --bg: #fafafa; --panel: #fff; --fg: #24292f; --accent: #2e7d32; --link: #0969da;
            --strong: #111; --border: #d8dee4; --border-soft: #d8dee4; --muted: #6a737d;
            --header-bg: rgba(255,255,255,.9); --hover-bg: #f0f2f4; --code-bg: #f0f2f4;
            --quote-bg: #f4f6f8; --quote-fg: #4b5563; --embed: #8250df;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--fg);
            font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; line-height: 1.7; }
        header {
            position: sticky; top: 0; display: flex; align-items: center; gap: 14px;
            padding: 12px 24px; background: var(--header-bg); backdrop-filter: blur(6px);
            border-bottom: 1px solid var(--border); z-index: 10;
        }
        header a.back { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 14px; }
        header a.back:hover { text-decoration: underline; }
        header .crumb { color: var(--muted); font-size: 13px; }
        main { max-width: 760px; margin: 0 auto; padding: 32px 24px 120px; }
        h1.page-title { font-size: 30px; margin: 0 0 20px; color: var(--strong); border-bottom: 1px solid var(--border); padding-bottom: 14px; }
        form { display: flex; flex-direction: column; gap: 16px; }

        .properties { padding: 2px 0 10px; }
        .properties-title { margin: 0 0 8px; color: var(--strong); font-size: 15px; font-weight: 600; }
        .property-row { display: grid; grid-template-columns: 92px minmax(0, 1fr); align-items: start; min-height: 38px; }
        .property-label { display: flex; align-items: center; gap: 8px; padding: 5px 0; color: var(--muted); font-size: 14px; }
        .property-label svg { width: 16px; height: 16px; flex: none; }
        .token-field { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; padding: 3px 0; }
        .property-token { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; padding: 1px 7px;
            border-radius: 5px; background: var(--quote-bg); color: var(--embed); font-size: 13px; line-height: 1.55; }
        .property-token span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .property-token button { border: 0; padding: 0; background: transparent; color: var(--muted); cursor: pointer;
            font: inherit; line-height: 1; }
        .property-token button:hover { color: var(--fg); }
        .property-input { flex: 1 1 120px; min-width: 90px; border: 0; outline: 0; padding: 3px 4px;
            background: transparent; color: var(--fg); font: inherit; font-size: 14px; }
        .property-input::placeholder { color: var(--muted); }
        .suggestions { position: absolute; top: calc(100% + 3px); left: 0; z-index: 20; display: none;
            min-width: 220px; max-width: min(360px, 100%); max-height: 220px; overflow-y: auto;
            padding: 4px; border: 1px solid var(--border-soft); border-radius: 6px;
            background: var(--panel); box-shadow: 0 8px 24px rgba(0,0,0,.22); }
        .suggestions.open { display: block; }
        .suggestion { width: 100%; border: 0; border-radius: 4px; padding: 6px 8px; text-align: left;
            background: transparent; color: var(--fg); cursor: pointer; font: inherit; font-size: 13px; }
        .suggestion:hover, .suggestion.selected { background: var(--hover-bg); }

        .toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
            background: var(--panel); border: 1px solid var(--border-soft); border-radius: 8px; padding: 8px; }
        .toolbar button { background: transparent; color: var(--fg); border: 1px solid transparent;
            border-radius: 6px; padding: 6px 10px; font-size: 14px; cursor: pointer; min-width: 34px; }
        .toolbar button:hover { background: var(--hover-bg); }
        .toolbar button:disabled { opacity: .45; cursor: wait; }
        .toolbar .sep { width: 1px; height: 22px; background: var(--border-soft); margin: 0 4px; }
        .toolbar .spacer { flex: 1; }
        .toolbar .toggle { border-color: var(--border-soft); font-weight: 600; font-size: 13px; }
        .toolbar .toggle.active { background: var(--accent); color: #10240f; border-color: var(--accent); }
        .upload-status { color: var(--muted); font-size: 12px; }
        .upload-status.error { color: #e57373; }

        /* WYSIWYG surface — mirrors the rendered note look */
        .editor {
            position: relative;
            min-height: 55vh; background: var(--panel); color: var(--fg);
            border: 1px solid var(--border-soft); border-radius: 8px; padding: 20px 24px; line-height: 1.7;
        }
        .editor:focus { outline: none; border-color: var(--accent); }
        .editor.dragging, textarea.dragging { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
        .editor h1, .editor h2, .editor h3, .editor h4 { color: var(--strong); margin: 1.2em 0 .5em; }
        .editor h1 { font-size: 26px; } .editor h2 { font-size: 22px; } .editor h3 { font-size: 19px; }
        .editor p { margin: 0 0 1em; }
        .editor a { color: var(--link); text-decoration: none; }
        .editor blockquote { border-left: 3px solid var(--accent); margin: 1em 0; padding: 2px 16px; color: var(--quote-fg); background: var(--quote-bg); }
        .editor code { background: var(--code-bg); padding: 2px 6px; border-radius: 4px; font-size: .9em; }
        .editor pre { background: var(--code-bg); padding: 14px 16px; border-radius: 8px; overflow-x: auto; }
        .editor pre code { background: none; padding: 0; }
        .editor hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
        .editor img { max-width: 100%; border-radius: 6px; }
        .editor .wikilink { color: var(--link); border-bottom: 1px dashed var(--link); cursor: default; }
        .editor .embed { color: var(--embed); }
        .editor .tag { color: var(--accent); }
        .editor-line { min-height: 1.7em; cursor: text; }
        .editor-line > :first-child { margin-top: 0; }
        .editor-line > :last-child { margin-bottom: 0; }
        .editor-line.rendered h1, .editor-line.rendered h2, .editor-line.rendered h3,
        .editor-line.rendered h4, .editor-line.rendered p,
        .editor-line.rendered blockquote, .editor-line.rendered ul,
        .editor-line.rendered ol, .editor-line.rendered pre { margin: 0; }
        .editor-line.rendered ul, .editor-line.rendered ol { padding-left: 1.6em; }
        .editor-line.active {
            white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg);
        }
        .editor-line.active:focus { outline: none; }
        .editor-line.active.source-h1 { color: var(--strong); font-size: 26px; font-weight: 700; }
        .editor-line.active.source-h2 { color: var(--strong); font-size: 22px; font-weight: 700; }
        .editor-line.active.source-h3 { color: var(--strong); font-size: 19px; font-weight: 700; }
        .editor-line.active.source-code {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 14px;
        }
        .wiki-suggestions { position: fixed; z-index: 30; display: none; width: min(360px, calc(100vw - 24px));
            max-height: 260px; overflow-y: auto; padding: 5px; border: 1px solid var(--border-soft);
            border-radius: 6px; background: var(--panel); box-shadow: 0 10px 28px rgba(0,0,0,.28); }
        .wiki-suggestions.open { display: block; }
        .wiki-suggestion { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center;
            width: 100%; border: 0; border-radius: 4px; padding: 7px 9px; text-align: left;
            background: transparent; color: var(--fg); cursor: pointer; font: inherit; }
        .wiki-suggestion:hover, .wiki-suggestion.selected { background: var(--hover-bg); }
        .wiki-suggestion-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .wiki-suggestion-type { color: var(--muted); font-size: 11px; text-transform: uppercase; }

        textarea {
            display: none; width: 100%; min-height: 55vh; resize: vertical;
            background: var(--panel); color: var(--fg); border: 1px solid var(--border-soft);
            border-radius: 8px; padding: 20px 24px; line-height: 1.6;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 14px;
        }
        textarea:focus { outline: none; border-color: var(--accent); }
        body.source .editor { display: none; }
        body.source textarea { display: block; }
        body.source .toolbar .fmt { opacity: .35; pointer-events: none; }
        body.source .properties { display: none; }

        .actions { display: flex; gap: 12px; }
        .actions button, .actions a.cancel {
            font-size: 14px; font-weight: 600; padding: 10px 20px; border-radius: 8px;
            text-decoration: none; cursor: pointer; border: 1px solid var(--border-soft);
        }
        .actions button.save { background: var(--accent); color: #10240f; border-color: var(--accent); }
        .actions a.cancel { background: transparent; color: var(--fg); }
        .actions a.cancel:hover { border-color: var(--muted); }
    </style>
    <script>
        (function () {
            var saved = localStorage.getItem("vault-theme");
            if (!saved) saved = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", saved);
        })();
    </script>
</head>
<body>
    <header>
        <a class="back" href="/">← Graph</a>
        <span class="crumb">Editing {{ title }}</span>
    </header>
    <main>
        <h1 class="page-title">Editing {{ title }}</h1>
        <form id="edit-form" method="post" action="{{ url_for('edit', note_id=note_id) }}">
            <section class="properties" aria-labelledby="properties-title">
                <h2 class="properties-title" id="properties-title">Properties</h2>
                <div class="property-row">
                    <label class="property-label" for="topics-input">
                        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18l6-12M6 9h12M5 15h12"/></svg>
                        Topics
                    </label>
                    <div class="token-field" data-property="topics">
                        <input class="property-input" id="topics-input" type="text" placeholder="Add topic" autocomplete="off" role="combobox" aria-expanded="false">
                        <div class="suggestions" role="listbox"></div>
                    </div>
                </div>
                <div class="property-row">
                    <label class="property-label" for="tags-input">
                        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 13l-7 7-9-9V4h7l9 9z"/><circle cx="8.5" cy="8.5" r="1"/></svg>
                        Tags
                    </label>
                    <div class="token-field" data-property="tags">
                        <input class="property-input" id="tags-input" type="text" placeholder="Add tag" autocomplete="off" role="combobox" aria-expanded="false">
                        <div class="suggestions" role="listbox"></div>
                    </div>
                </div>
            </section>
            <div class="toolbar">
                <button type="button" class="fmt" data-cmd="h2" title="Heading">H</button>
                <button type="button" class="fmt" data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
                <button type="button" class="fmt" data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
                <button type="button" class="fmt" data-cmd="strike" title="Strikethrough"><s>S</s></button>
                <span class="sep"></span>
                <button type="button" class="fmt" data-cmd="ul" title="Bullet list">• List</button>
                <button type="button" class="fmt" data-cmd="quote" title="Quote">❝</button>
                <button type="button" class="fmt" data-cmd="code" title="Inline code">&lt;/&gt;</button>
                <button type="button" class="fmt" data-cmd="link" title="Link">🔗</button>
                <button type="button" id="upload-image" title="Add image" aria-label="Add image">🖼 Image</button>
                <input id="image-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
                <span class="spacer"></span>
                <span id="upload-status" class="upload-status" role="status" aria-live="polite"></span>
                <button type="button" class="toggle" id="toggle-source" title="Toggle raw markdown">&lt;/&gt; Source</button>
            </div>

            <div id="editor" class="editor" spellcheck="true"></div>
            <div id="wiki-suggestions" class="wiki-suggestions" role="listbox"></div>
            <textarea id="raw" name="content" spellcheck="false">{{ content }}</textarea>
            <textarea id="property-data" hidden>{{ property_data|tojson }}</textarea>

            <div class="actions">
                <button type="submit" class="save">Save</button>
                <a class="cancel" href="{{ url_for('note', note_id=note_id) }}">Cancel</a>
            </div>
        </form>
    </main>

    <script>
    (function () {
        const form = document.getElementById('edit-form');
        const editor = document.getElementById('editor');
        const raw = document.getElementById('raw');
        const toggle = document.getElementById('toggle-source');
        const uploadButton = document.getElementById('upload-image');
        const imageInput = document.getElementById('image-input');
        const uploadStatus = document.getElementById('upload-status');
        const wikiMenu = document.getElementById('wiki-suggestions');
        const propertyData = JSON.parse(document.getElementById('property-data').value);
        const propertyOptions = propertyData.options;
        const wikiOptions = propertyData.wikiOptions;
        const properties = propertyData.values;
        let preservedFrontmatter = [];
        let wikiState = null;

        // ---- helpers ---------------------------------------------------
        function escHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function escAttr(s) {
            return escHtml(s).replace(/"/g, '&quot;');
        }

        function propertyValues(frontmatterLines, name) {
            const values = [];
            for (let index = 0; index < frontmatterLines.length; index++) {
                const match = frontmatterLines[index].match(new RegExp('^' + name + '\\s*:\\s*(.*)$', 'i'));
                if (!match) continue;
                const parts = [match[1]];
                while (index + 1 < frontmatterLines.length && /^\s+/.test(frontmatterLines[index + 1])) {
                    parts.push(frontmatterLines[++index].replace(/^\s*-\s*/, ''));
                }
                const source = parts.join(',');
                if (name === 'topics') {
                    const links = [...source.matchAll(/\[\[([^\]|#]+)/g)].map(item => item[1].trim());
                    if (links.length) return links;
                }
                return source.replace(/^\s*\[|\]\s*$/g, '').split(',')
                    .map(value => value.trim().replace(/^['"]|['"]$/g, '').replace(/^#/, ''))
                    .filter(Boolean);
            }
            return values;
        }

        function parseDocument(markdown) {
            const normalized = markdown.replace(/\r\n/g, '\n');
            const match = normalized.match(/^---\s*\n([\s\S]*?)\n---(?:\n|$)/);
            const frontmatterLines = match ? match[1].split('\n') : [];
            if (match) {
                properties.tags = propertyValues(frontmatterLines, 'tags');
                properties.topics = propertyValues(frontmatterLines, 'topics');
            } else {
                properties.tags = [];
                properties.topics = [];
            }
            preservedFrontmatter = [];
            for (let index = 0; index < frontmatterLines.length; index++) {
                if (/^(tags|topics)\s*:/i.test(frontmatterLines[index])) {
                    while (index + 1 < frontmatterLines.length && /^\s+/.test(frontmatterLines[index + 1])) index++;
                } else {
                    preservedFrontmatter.push(frontmatterLines[index]);
                }
            }
            lines = (match ? normalized.slice(match[0].length) : normalized).split('\n');
            if (!lines.length) lines = [''];
            renderPropertyFields();
        }

        function buildMarkdown() {
            syncActiveLine();
            const frontmatterLines = preservedFrontmatter.filter(line => line.trim());
            if (properties.topics.length) {
                frontmatterLines.push('topics:');
                properties.topics.forEach(topic => frontmatterLines.push('  - "[[' + topic.replace(/"/g, '\\"') + ']]"'));
            }
            if (properties.tags.length) {
                frontmatterLines.push('tags:');
                properties.tags.forEach(tag => frontmatterLines.push('  - ' + tag));
            }
            const body = lines.join('\n');
            return frontmatterLines.length ? '---\n' + frontmatterLines.join('\n') + '\n---\n' + body : body;
        }

        function addProperty(name, value) {
            value = value.trim();
            if (name === 'tags') value = value.replace(/^#/, '').replace(/\s+/g, '-');
            if (!value || properties[name].some(item => item.toLowerCase() === value.toLowerCase())) return;
            properties[name].push(value);
            renderPropertyFields();
        }

        function matchingOptions(name, query) {
            const selected = new Set(properties[name].map(value => value.toLowerCase()));
            return propertyOptions[name].filter(value =>
                !selected.has(value.toLowerCase()) && value.toLowerCase().includes(query.toLowerCase())).slice(0, 8);
        }

        function renderSuggestions(field) {
            const name = field.dataset.property;
            const input = field.querySelector('.property-input');
            const menu = field.querySelector('.suggestions');
            const matches = matchingOptions(name, input.value.trim());
            menu.replaceChildren(...matches.map((value, index) => {
                const option = document.createElement('button');
                option.type = 'button';
                option.className = 'suggestion' + (index === 0 ? ' selected' : '');
                option.textContent = value;
                option.addEventListener('mousedown', event => {
                    event.preventDefault();
                    addProperty(name, value);
                    input.value = '';
                    input.focus();
                });
                return option;
            }));
            menu.classList.toggle('open', matches.length > 0 && document.activeElement === input);
            input.setAttribute('aria-expanded', menu.classList.contains('open'));
        }

        function renderPropertyFields() {
            document.querySelectorAll('.token-field').forEach(field => {
                const name = field.dataset.property;
                field.querySelectorAll('.property-token').forEach(token => token.remove());
                const input = field.querySelector('.property-input');
                properties[name].forEach(value => {
                    const token = document.createElement('span');
                    token.className = 'property-token';
                    const text = document.createElement('span');
                    text.textContent = value;
                    const remove = document.createElement('button');
                    remove.type = 'button';
                    remove.title = 'Remove ' + value;
                    remove.setAttribute('aria-label', 'Remove ' + value);
                    remove.textContent = '×';
                    remove.addEventListener('click', () => {
                        properties[name] = properties[name].filter(item => item !== value);
                        renderPropertyFields();
                        input.focus();
                    });
                    token.append(text, remove);
                    field.insertBefore(token, input);
                });
                renderSuggestions(field);
            });
        }

        document.querySelectorAll('.token-field').forEach(field => {
            const name = field.dataset.property;
            const input = field.querySelector('.property-input');
            input.addEventListener('focus', () => renderSuggestions(field));
            input.addEventListener('input', () => renderSuggestions(field));
            input.addEventListener('blur', () => setTimeout(() => renderSuggestions(field), 0));
            input.addEventListener('keydown', event => {
                const first = field.querySelector('.suggestion');
                if (event.key === 'Enter' || (name === 'tags' && event.key === ',')) {
                    event.preventDefault();
                    addProperty(name, first ? first.textContent : input.value);
                    input.value = '';
                } else if (event.key === 'Backspace' && !input.value && properties[name].length) {
                    properties[name].pop();
                    renderPropertyFields();
                } else if (event.key === 'Escape') {
                    field.querySelector('.suggestions').classList.remove('open');
                    input.setAttribute('aria-expanded', 'false');
                }
            });
        });

        // ---- markdown -> HTML (for the WYSIWYG surface) ----------------
        function isBlockStart(line) {
            return /^(#{1,6})\s+/.test(line) || /^\s*>/.test(line) ||
                /^\s*[-*+]\s+/.test(line) || /^\s*\d+[.)]\s+/.test(line) ||
                /^\s*([-*_])(\s*\1){2,}\s*$/.test(line) || /^(```|~~~)/.test(line);
        }

        function inlineToHtml(src) {
            let out = '', i = 0;
            const isWord = c => /\w/.test(c || '');
            while (i < src.length) {
                const rest = src.slice(i);
                let m;
                if (src[i] === '`' && (m = rest.match(/^`([^`]+)`/))) {
                    out += '<code>' + escHtml(m[1]) + '</code>'; i += m[0].length; continue;
                }
                if (rest.startsWith('![[') && (m = rest.match(/^!\[\[([^\]]+)\]\]/))) {
                    const target = m[1].split('|')[0].trim();
                    if (/\.(png|jpe?g|gif|webp)$/i.test(target)) {
                        const src = '/media/' + target.split('/').map(encodeURIComponent).join('/');
                        out += '<img data-md="' + escAttr(m[0]) + '" src="' + escAttr(src) + '" alt="' + escAttr(target) + '">';
                    } else {
                        out += '<span class="embed" contenteditable="false" data-md="' + escAttr(m[0]) + '">📎 ' + escHtml(m[1]) + '</span>';
                    }
                    i += m[0].length; continue;
                }
                if (rest.startsWith('[[') && (m = rest.match(/^\[\[([^\]]+)\]\]/))) {
                    const text = (m[1].split('|')[1] || m[1].split('#')[0]).trim();
                    out += '<span class="wikilink" contenteditable="false" data-md="' + escAttr(m[0]) + '">' + escHtml(text) + '</span>';
                    i += m[0].length; continue;
                }
                if (rest.startsWith('![') && (m = rest.match(/^!\[([^\]]*)\]\(([^)]+)\)/))) {
                    out += '<img data-md="' + escAttr(m[0]) + '" src="' + escAttr(m[2]) + '" alt="' + escAttr(m[1]) + '">';
                    i += m[0].length; continue;
                }
                if (src[i] === '[' && (m = rest.match(/^\[([^\]]+)\]\(([^)]+)\)/))) {
                    out += '<a href="' + escAttr(m[2]) + '">' + inlineToHtml(m[1]) + '</a>'; i += m[0].length; continue;
                }
                if ((rest.startsWith('**') || rest.startsWith('__')) &&
                    (m = rest.match(rest[0] === '*' ? /^\*\*([\s\S]+?)\*\*/ : /^__([\s\S]+?)__/))) {
                    out += '<strong>' + inlineToHtml(m[1]) + '</strong>'; i += m[0].length; continue;
                }
                if (src[i] === '*' && (m = rest.match(/^\*([^\s*][\s\S]*?)\*/))) {
                    out += '<em>' + inlineToHtml(m[1]) + '</em>'; i += m[0].length; continue;
                }
                if (src[i] === '_' && !isWord(src[i - 1]) && (m = rest.match(/^_([^\s_][\s\S]*?)_/)) && !isWord(src[i + m[0].length])) {
                    out += '<em>' + inlineToHtml(m[1]) + '</em>'; i += m[0].length; continue;
                }
                if (rest.startsWith('~~') && (m = rest.match(/^~~([\s\S]+?)~~/))) {
                    out += '<del>' + inlineToHtml(m[1]) + '</del>'; i += m[0].length; continue;
                }
                if (src[i] === '#' && !isWord(src[i - 1]) && (m = rest.match(/^#([^\W\d][\w\/\-]*)/))) {
                    out += '<span class="tag" contenteditable="false" data-md="' + escAttr(m[0]) + '">' + escHtml(m[0]) + '</span>';
                    i += m[0].length; continue;
                }
                out += escHtml(src[i]); i++;
            }
            return out;
        }

        function mdToHtml(md) {
            const lines = md.replace(/\r\n/g, '\n').split('\n');
            let html = '', i = 0;
            while (i < lines.length) {
                const line = lines[i];
                if (/^\s*$/.test(line)) { i++; continue; }
                let m = line.match(/^(```|~~~)(.*)$/);
                if (m) {
                    const marker = m[1], buf = []; i++;
                    while (i < lines.length && !lines[i].startsWith(marker)) { buf.push(lines[i]); i++; }
                    i++;
                    const src = marker + m[2] + '\n' + buf.join('\n') + '\n' + marker;
                    html += '<pre data-md="' + escAttr(src) + '"><code>' + escHtml(buf.join('\n')) + '</code></pre>';
                    continue;
                }
                if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {
                    const l = m[1].length; html += '<h' + l + '>' + inlineToHtml(m[2]) + '</h' + l + '>'; i++; continue;
                }
                if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { html += '<hr>'; i++; continue; }
                if (/^\s*>/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
                    html += '<blockquote>' + buf.map(inlineToHtml).join('<br>') + '</blockquote>'; continue;
                }
                if (/^\s*[-*+]\s+/.test(line)) {
                    const items = [];
                    while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*+]\s+/, '')); i++; }
                    html += '<ul>' + items.map(t => '<li>' + inlineToHtml(t) + '</li>').join('') + '</ul>'; continue;
                }
                if (/^\s*\d+[.)]\s+/.test(line)) {
                    const items = [];
                    while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*\d+[.)]\s+/, '')); i++; }
                    html += '<ol>' + items.map(t => '<li>' + inlineToHtml(t) + '</li>').join('') + '</ol>'; continue;
                }
                const buf = [];
                while (i < lines.length && !/^\s*$/.test(lines[i]) && !isBlockStart(lines[i])) { buf.push(lines[i]); i++; }
                html += '<p>' + buf.map(inlineToHtml).join('<br>') + '</p>';
            }
            return html || '<p><br></p>';
        }

        // ---- live preview editing -------------------------------------
        let lines = [];
        let activeIndex = null;

        function sourceText(row) {
            return row.textContent.replace(/\u00a0/g, '');
        }

        function selectionOffsets(row) {
            const selection = window.getSelection();
            if (!selection.rangeCount || !row.contains(selection.anchorNode)) return [sourceText(row).length, sourceText(row).length];
            const range = selection.getRangeAt(0);
            const before = range.cloneRange();
            before.selectNodeContents(row);
            before.setEnd(range.startContainer, range.startOffset);
            const start = before.toString().length;
            before.setEnd(range.endContainer, range.endOffset);
            return [start, before.toString().length];
        }

        function setCaret(row, start, end = start) {
            const text = row.firstChild || row.appendChild(document.createTextNode(''));
            const range = document.createRange();
            range.setStart(text, Math.min(start, text.length));
            range.setEnd(text, Math.min(end, text.length));
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
        }

        function renderedLine(line) {
            if (!line) return '<br>';
            if (/^(```|~~~)/.test(line)) return '<code>' + escHtml(line) + '</code>';
            return mdToHtml(line);
        }

        function syncActiveLine() {
            if (activeIndex === null) return;
            const row = editor.querySelector('.editor-line.active');
            if (row) lines[activeIndex] = sourceText(row);
        }

        function closeWikiSuggestions() {
            wikiState = null;
            wikiMenu.classList.remove('open');
            wikiMenu.replaceChildren();
        }

        function wikiContext(row) {
            const [start, end] = selectionOffsets(row);
            if (start !== end) return null;
            const line = sourceText(row);
            const completed = line.slice(0, start).match(/\[\[([^\[\]]*)\]\]$/);
            if (completed) {
                return {
                    start: start - completed[0].length,
                    end: start,
                    query: completed[1],
                };
            }
            const opening = line.lastIndexOf('[[', start);
            if (opening < 0 || line.slice(opening + 2, start).includes(']]')) return null;
            const query = line.slice(opening + 2, start);
            if (query.includes('[') || query.includes(']')) return null;
            return {
                start: opening,
                end: line.slice(start).startsWith(']]') ? start + 2 : start,
                query,
            };
        }

        function matchingWikiOptions(query) {
            const lowered = query.toLowerCase();
            const results = [];
            const labels = { notes: 'Note', topics: 'Topic', tags: 'Tag' };
            for (const type of ['notes', 'topics', 'tags']) {
                for (const value of wikiOptions[type]) {
                    if (!value.toLowerCase().includes(lowered)) continue;
                    results.push({ type, label: labels[type], value });
                }
            }
            return results.sort((left, right) => {
                const leftStarts = left.value.toLowerCase().startsWith(lowered) ? 0 : 1;
                const rightStarts = right.value.toLowerCase().startsWith(lowered) ? 0 : 1;
                return leftStarts - rightStarts || left.value.localeCompare(right.value);
            }).slice(0, 12);
        }

        function selectWikiSuggestion(index) {
            if (!wikiState || !wikiState.results[index]) return;
            const result = wikiState.results[index];
            const insertion = result.type === 'tags' ? '#' + result.value : '[[' + result.value + ']]';
            const line = lines[activeIndex];
            lines[activeIndex] = line.slice(0, wikiState.start) + insertion + line.slice(wikiState.end);
            const caret = wikiState.start + insertion.length;
            closeWikiSuggestions();
            renderLines(activeIndex, caret);
        }

        function renderWikiSuggestions(row) {
            const context = wikiContext(row);
            if (!context) {
                closeWikiSuggestions();
                return;
            }
            const results = matchingWikiOptions(context.query);
            if (!results.length) {
                closeWikiSuggestions();
                return;
            }
            wikiState = { ...context, results, selected: 0 };
            wikiMenu.replaceChildren(...results.map((result, index) => {
                const option = document.createElement('button');
                option.type = 'button';
                option.className = 'wiki-suggestion' + (index === 0 ? ' selected' : '');
                option.setAttribute('role', 'option');
                const name = document.createElement('span');
                name.className = 'wiki-suggestion-name';
                name.textContent = result.type === 'tags' ? '#' + result.value : result.value;
                const type = document.createElement('span');
                type.className = 'wiki-suggestion-type';
                type.textContent = result.label;
                option.append(name, type);
                option.addEventListener('mousedown', event => {
                    event.preventDefault();
                    selectWikiSuggestion(index);
                });
                return option;
            }));
            const selection = window.getSelection();
            const caretRect = selection.rangeCount ? selection.getRangeAt(0).getBoundingClientRect() : row.getBoundingClientRect();
            const rowRect = row.getBoundingClientRect();
            wikiMenu.style.left = Math.max(12, Math.min(caretRect.left || rowRect.left, window.innerWidth - 372)) + 'px';
            wikiMenu.style.top = (caretRect.bottom || rowRect.bottom) + 5 + 'px';
            wikiMenu.classList.add('open');
        }

        function moveWikiSelection(direction) {
            if (!wikiState) return;
            wikiState.selected = (wikiState.selected + direction + wikiState.results.length) % wikiState.results.length;
            wikiMenu.querySelectorAll('.wiki-suggestion').forEach((option, index) =>
                option.classList.toggle('selected', index === wikiState.selected));
            wikiMenu.children[wikiState.selected].scrollIntoView({ block: 'nearest' });
        }

        function renderLines(focusIndex = null, caretStart = null, caretEnd = caretStart) {
            closeWikiSuggestions();
            editor.replaceChildren();
            lines.forEach((line, index) => {
                const row = document.createElement('div');
                row.className = 'editor-line ' + (index === focusIndex ? 'active' : 'rendered');
                row.dataset.index = index;
                if (index === focusIndex) {
                    const heading = line.match(/^(#{1,3})\s/);
                    if (heading) row.classList.add('source-h' + heading[1].length);
                    if (/^(```|~~~)/.test(line)) row.classList.add('source-code');
                    row.contentEditable = 'true';
                    row.textContent = line;
                } else {
                    row.innerHTML = renderedLine(line);
                }
                editor.appendChild(row);
            });
            activeIndex = focusIndex;
            if (focusIndex !== null) {
                const row = editor.children[focusIndex];
                const start = caretStart === null ? lines[focusIndex].length : caretStart;
                const end = caretEnd === null ? start : caretEnd;
                row.focus();
                setCaret(row, start, end);
            }
        }

        function activateLine(index, caret = null) {
            syncActiveLine();
            renderLines(index, caret);
        }

        editor.addEventListener('mousedown', event => {
            const row = event.target.closest('.editor-line');
            if (!row || row.classList.contains('active')) return;
            event.preventDefault();
            activateLine(Number(row.dataset.index));
        });

        editor.addEventListener('input', event => {
            const row = event.target.closest('.editor-line.active');
            if (row) {
                lines[activeIndex] = sourceText(row);
                renderWikiSuggestions(row);
            }
        });

        editor.addEventListener('keyup', event => {
            if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
            const row = event.target.closest('.editor-line.active');
            if (row) renderWikiSuggestions(row);
        });

        editor.addEventListener('paste', event => {
            const row = event.target.closest('.editor-line.active');
            if (!row) return;
            const images = [...event.clipboardData.files].filter(file => file.type.startsWith('image/'));
            if (images.length) {
                event.preventDefault();
                uploadImages(images);
                return;
            }
            event.preventDefault();
            const text = event.clipboardData.getData('text/plain').replace(/\r\n/g, '\n');
            const [start, end] = selectionOffsets(row);
            const pastedLines = text.split('\n');
            const first = lines[activeIndex].slice(0, start) + pastedLines.shift();
            const last = pastedLines.pop();
            if (last === undefined) {
                lines[activeIndex] = first + lines[activeIndex].slice(end);
                renderLines(activeIndex, start + text.length);
                return;
            }
            const replacement = [first, ...pastedLines, last + lines[activeIndex].slice(end)];
            lines.splice(activeIndex, 1, ...replacement);
            renderLines(activeIndex + replacement.length - 1, last.length);
        });

        function continuationFor(line) {
            let match = line.match(/^(\s*[-*+]\s+)(\[[ xX]\]\s+)?(.*)$/);
            if (match) {
                return {
                    prefix: match[1] + (match[2] ? '[ ] ' : ''),
                    empty: match[3].length === 0,
                };
            }
            match = line.match(/^(\s*)(\d+)([.)])(\s+)(.*)$/);
            if (match) {
                return {
                    prefix: match[1] + (Number(match[2]) + 1) + match[3] + match[4],
                    empty: match[5].length === 0,
                };
            }
            match = line.match(/^(\s*(?:>\s*)+)(.*)$/);
            if (match) return { prefix: match[1], empty: match[2].length === 0 };
            return null;
        }

        editor.addEventListener('keydown', event => {
            const row = event.target.closest('.editor-line.active');
            if (!row) return;
            const [start, end] = selectionOffsets(row);
            lines[activeIndex] = sourceText(row);
            if (wikiState && (event.key === 'ArrowDown' || event.key === 'ArrowUp')) {
                event.preventDefault();
                moveWikiSelection(event.key === 'ArrowDown' ? 1 : -1);
            } else if (wikiState && (event.key === 'Enter' || event.key === 'Tab')) {
                event.preventDefault();
                selectWikiSuggestion(wikiState.selected);
            } else if (wikiState && event.key === 'Escape') {
                event.preventDefault();
                closeWikiSuggestions();
            } else if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'b') {
                event.preventDefault();
                replaceSelection('**', '**', 'bold text');
            } else if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'i') {
                event.preventDefault();
                replaceSelection('*', '*', 'italic text');
            } else if (event.key === 'Enter') {
                event.preventDefault();
                const before = lines[activeIndex].slice(0, start);
                const after = lines[activeIndex].slice(end);
                const continuation = continuationFor(lines[activeIndex]);
                if (continuation && continuation.empty) {
                    lines[activeIndex] = '';
                    renderLines(activeIndex, 0);
                } else {
                    const prefix = continuation ? continuation.prefix : '';
                    lines.splice(activeIndex, 1, before, prefix + after);
                    renderLines(activeIndex + 1, prefix.length);
                }
            } else if (event.key === 'Backspace' && start === 0 && end === 0 && activeIndex > 0) {
                event.preventDefault();
                const previousLength = lines[activeIndex - 1].length;
                lines.splice(activeIndex - 1, 2, lines[activeIndex - 1] + lines[activeIndex]);
                renderLines(activeIndex - 1, previousLength);
            } else if (event.key === 'Delete' && start === lines[activeIndex].length && activeIndex < lines.length - 1) {
                event.preventDefault();
                lines.splice(activeIndex, 2, lines[activeIndex] + lines[activeIndex + 1]);
                renderLines(activeIndex, start);
            } else if (event.key === 'ArrowUp' && activeIndex > 0) {
                event.preventDefault();
                renderLines(activeIndex - 1, Math.min(start, lines[activeIndex - 1].length));
            } else if (event.key === 'ArrowDown' && activeIndex < lines.length - 1) {
                event.preventDefault();
                renderLines(activeIndex + 1, Math.min(start, lines[activeIndex + 1].length));
            }
        });

        // ---- toolbar ---------------------------------------------------
        function replaceSelection(prefix, suffix = prefix, placeholder = '') {
            if (activeIndex === null) activateLine(0);
            const row = editor.querySelector('.editor-line.active');
            const [start, end] = selectionOffsets(row);
            const selected = lines[activeIndex].slice(start, end) || placeholder;
            lines[activeIndex] = lines[activeIndex].slice(0, start) + prefix + selected + suffix + lines[activeIndex].slice(end);
            renderLines(activeIndex, start + prefix.length, start + prefix.length + selected.length);
        }

        function togglePrefix(prefix) {
            if (activeIndex === null) activateLine(0);
            const line = lines[activeIndex];
            lines[activeIndex] = line.startsWith(prefix) ? line.slice(prefix.length) : prefix + line;
            renderLines(activeIndex, lines[activeIndex].length);
        }

        const commands = {
            h2: () => togglePrefix('## '),
            bold: () => replaceSelection('**', '**', 'bold text'),
            italic: () => replaceSelection('*', '*', 'italic text'),
            strike: () => replaceSelection('~~', '~~', 'text'),
            ul: () => togglePrefix('- '),
            quote: () => togglePrefix('> '),
            code: () => replaceSelection('`', '`', 'code'),
            link: () => replaceSelection('[', '](url)', 'link text'),
        };

        document.querySelectorAll('.toolbar .fmt').forEach(btn => {
            btn.addEventListener('mousedown', e => e.preventDefault()); // keep selection
            btn.addEventListener('click', () => {
                const fn = commands[btn.dataset.cmd];
                if (fn) fn();
            });
        });

        // ---- image uploads --------------------------------------------
        function currentInsertionPoint() {
            if (document.body.classList.contains('source')) {
                return { source: true, start: raw.selectionStart, end: raw.selectionEnd };
            }
            if (activeIndex === null) return { source: false, index: lines.length - 1, start: lines.at(-1).length, end: lines.at(-1).length };
            const row = editor.querySelector('.editor-line.active');
            syncActiveLine();
            const [start, end] = selectionOffsets(row);
            return { source: false, index: activeIndex, start, end };
        }

        function insertUpload(embed, point) {
            if (point.source) {
                raw.setRangeText(embed, point.start, point.end, 'end');
                point.start = point.end = raw.selectionStart;
                raw.focus();
                return;
            }
            const line = lines[point.index];
            lines[point.index] = line.slice(0, point.start) + embed + line.slice(point.end);
            point.start += embed.length;
            point.end = point.start;
            renderLines(point.index, point.start);
        }

        async function uploadImages(files, point = currentInsertionPoint()) {
            const images = [...files].filter(file => file.type.startsWith('image/'));
            if (!images.length) {
                uploadStatus.textContent = 'Drop an image file.';
                uploadStatus.classList.add('error');
                return;
            }
            uploadButton.disabled = true;
            uploadStatus.classList.remove('error');
            try {
                for (const [index, image] of images.entries()) {
                    uploadStatus.textContent = 'Uploading ' + (index + 1) + ' of ' + images.length + '…';
                    const data = new FormData();
                    data.append('image', image);
                    const response = await fetch('{{ url_for("upload_image") }}', { method: 'POST', body: data });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error || 'Image upload failed.');
                    insertUpload(result.embed, point);
                }
                uploadStatus.textContent = images.length === 1 ? 'Image added' : images.length + ' images added';
            } catch (error) {
                uploadStatus.textContent = error.message;
                uploadStatus.classList.add('error');
            } finally {
                uploadButton.disabled = false;
                imageInput.value = '';
            }
        }

        uploadButton.addEventListener('mousedown', event => event.preventDefault());
        uploadButton.addEventListener('click', () => imageInput.click());
        imageInput.addEventListener('change', () => uploadImages(imageInput.files));

        raw.addEventListener('paste', event => {
            const images = [...event.clipboardData.files].filter(file => file.type.startsWith('image/'));
            if (!images.length) return;
            event.preventDefault();
            uploadImages(images);
        });

        [editor, raw].forEach(surface => {
            surface.addEventListener('dragover', event => {
                if (![...event.dataTransfer.items].some(item => item.kind === 'file')) return;
                event.preventDefault();
                event.dataTransfer.dropEffect = 'copy';
                surface.classList.add('dragging');
            });
            surface.addEventListener('dragleave', () => surface.classList.remove('dragging'));
            surface.addEventListener('drop', event => {
                event.preventDefault();
                surface.classList.remove('dragging');
                uploadImages(event.dataTransfer.files);
            });
        });

        // ---- source toggle ---------------------------------------------
        function toLivePreview() {
            parseDocument(raw.value);
            document.body.classList.remove('source');
            toggle.classList.remove('active');
            renderLines();
        }
        function toSource() {
            raw.value = buildMarkdown();
            document.body.classList.add('source');
            toggle.classList.add('active');
        }
        toggle.addEventListener('click', () => {
            document.body.classList.contains('source') ? toLivePreview() : toSource();
        });

        // ---- save ------------------------------------------------------
        form.addEventListener('submit', () => {
            if (!document.body.classList.contains('source')) {
                raw.value = buildMarkdown();
            }
        });

        // ---- init ------------------------------------------------------
        toLivePreview();
    })();
    </script>
</body>
</html>
