<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ tag }} — Vault Wiki</title>
    <style>
        :root {
            --bg: #1e1e1e; --panel: #252526; --fg: #d8d8d8; --accent: #4caf50; --link: #7cb7ff;
            --strong: #fff; --border: #333; --border-soft: #3a3a3a; --muted: #888;
            --header-bg: rgba(30,30,30,.9); --input-bg: #2a2a2a; --input-border: #444;
        }
        :root[data-theme="light"] {
            --bg: #fafafa; --panel: #fff; --fg: #24292f; --accent: #2e7d32; --link: #0969da;
            --strong: #111; --border: #d8dee4; --border-soft: #d8dee4; --muted: #6a737d;
            --header-bg: rgba(255,255,255,.9); --input-bg: #fff; --input-border: #d0d7de;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--fg);
            font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; line-height: 1.7; }
        header {
            position: sticky; top: 0; display: flex; align-items: center; gap: 14px;
            padding: 12px 24px; background: var(--header-bg); backdrop-filter: blur(6px);
            border-bottom: 1px solid var(--border); z-index: 10;
        }
        header a.back { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 14px; }
        header a.back:hover { text-decoration: underline; }
        header .crumb { color: var(--muted); font-size: 13px; }
        #theme-toggle {
            margin-left: auto; background: var(--input-bg); border: 1px solid var(--input-border);
            color: var(--fg); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; line-height: 1;
        }
        #theme-toggle:hover { border-color: var(--accent); }
        main { max-width: 760px; margin: 0 auto; padding: 40px 24px 120px; }
        h1.page-title { font-size: 30px; margin: 0 0 6px; color: var(--strong); }
        h1.page-title .hash { color: var(--accent); }
        .count { color: var(--muted); font-size: 14px; margin: 0 0 24px; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
        ul.notes { list-style: none; margin: 0; padding: 0; }
        ul.notes li { margin: 0 0 4px; }
        ul.notes a { display: block; color: var(--link); text-decoration: none;
            padding: 12px 16px; background: var(--panel); border: 1px solid var(--border-soft); border-radius: 8px; }
        ul.notes a:hover { border-color: var(--accent); }
        .local-graph-panel { margin-top: 24px; background: var(--panel); border: 1px solid var(--border-soft);
            border-radius: 8px; overflow: hidden; }
        .local-graph-panel h2 { margin: 0; padding: 14px 18px; border-bottom: 1px solid var(--border);
            color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .05em; }
        #local-graph { width: 100%; height: 420px; overflow: hidden; }
        #local-graph svg { display: block; width: 100%; height: 100%; cursor: grab; }
        #local-graph svg:active { cursor: grabbing; }
        .local-link { stroke: var(--muted); stroke-opacity: .55; stroke-width: 1.2; }
        .local-node { cursor: pointer; stroke: var(--panel); stroke-width: 2; }
        .local-node.current { stroke: var(--strong); stroke-width: 3; }
        .local-label { fill: var(--fg); font-size: 12px; pointer-events: none; }
        .local-label.current { fill: var(--strong); font-weight: 700; }
        #preview { position: fixed; max-width: 360px; max-height: 60vh; overflow: hidden;
            background: var(--panel); color: var(--fg); border: 1px solid var(--border);
            border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,.5); padding: 14px 16px;
            z-index: 30; pointer-events: none; opacity: 0; transition: opacity .12s ease;
            display: none; font-size: 13px; line-height: 1.5; }
        #preview.visible { opacity: 1; display: block; }
        #preview h3 { margin: 0 0 8px; font-size: 15px; color: var(--strong);
            border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        #preview .body { max-height: 44vh; overflow: hidden;
            -webkit-mask-image: linear-gradient(180deg, #000 70%, transparent);
            mask-image: linear-gradient(180deg, #000 70%, transparent); }
        #preview img { max-width: 100%; }
        #preview p { margin: 6px 0; }
        #preview .hint { margin-top: 10px; font-size: 11px; color: var(--muted); }
        @media (max-width: 620px) {
            main { padding: 20px 12px 80px; }
            #local-graph { height: 340px; }
        }
    </style>
    <script>
        (function () {
            var saved = localStorage.getItem("vault-theme");
            if (!saved) saved = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", saved);
        })();
    </script>
</head>
<body>
    <header>
        <a class="back" href="/">← Graph</a>
        <span class="crumb">{{ tag }}</span>
        <button id="theme-toggle" type="button" title="Toggle light/dark theme" aria-label="Toggle theme"></button>
    </header>
    <main>
        <h1 class="page-title"><span class="hash">#</span>{{ tag.lstrip('#') }}</h1>
        <p class="count">{{ notes|length }} note{{ '' if notes|length == 1 else 's' }} tagged</p>
        <ul class="notes">
            {% for n in notes %}
            <li><a href="{{ n.url }}">{{ n.title }}</a></li>
            {% endfor %}
        </ul>
        <section class="local-graph-panel" aria-labelledby="local-graph-title">
            <h2 id="local-graph-title">Local graph</h2>
            <div id="local-graph" data-center-id="{{ tag }}" data-center-title="{{ tag }}"></div>
        </section>
    </main>
    <div id="preview">
        <h3>Note preview</h3>
        <div class="body"></div>
        <div class="hint">Click to open →</div>
    </div>
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script id="local-nodes-data" type="application/json">{{ local_nodes|safe }}</script>
    <script id="local-links-data" type="application/json">{{ local_links|safe }}</script>
    <script>
        var themeToggle = document.getElementById("theme-toggle");
        function syncThemeButton() {
            var dark = document.documentElement.getAttribute("data-theme") !== "light";
            themeToggle.textContent = dark ? "☀️" : "🌙";
        }
        themeToggle.addEventListener("click", function () {
            var next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
            document.documentElement.setAttribute("data-theme", next);
            localStorage.setItem("vault-theme", next);
            syncThemeButton();
        });
        syncThemeButton();
    </script>
    <script src="{{ url_for('static', filename='local-graph.js') }}"></script>
</body>
</html>
